# Disable bundled Ollama. Configure independent chat/embedding profiles through env or Settings > AI.
services:
  ollama:
    profiles: ["local-ollama"]
  backend-api:
    environment:
      LEGACY_OLLAMA_SERVICE: "false"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-${OLLAMA_BASE_URL:-}}
  parser-worker:
    environment:
      LEGACY_OLLAMA_SERVICE: "false"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-${OLLAMA_BASE_URL:-}}
  parser-beat:
    environment:
      LEGACY_OLLAMA_SERVICE: "false"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
