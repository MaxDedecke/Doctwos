version: '3.8'

# Hot-reload overlay for local dev — keeps docker-compose.yml self-host-clean
# (no source bind-mounts, no dev-only commands). Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend-api:
    environment:
      UVICORN_RELOAD: "1"
    volumes:
      - ./backend:/app
      - ./repos:/repos

  parser-worker:
    volumes:
      - ./parser:/app
      - ./repos:/repos

  parser-test:
    profiles: ["test"]
    build:
      context: ./parser
      target: dev
    image: doctus-parser-test:dev
    command: ["python", "-m", "pytest", "tests/", "-q"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      LLM_MODEL: ${LLM_MODEL:-disabled}
      COMPLIANCE_LLM_TIMEOUT: ${COMPLIANCE_LLM_TIMEOUT:-180}
      ALLOW_CLOUD_LLM: ${ALLOW_CLOUD_LLM:-}
    volumes:
      - ./parser:/app
      - ./repos:/repos

  frontend:
    build:
      context: ./frontend
      target: deps
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
