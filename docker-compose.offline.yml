# Generated service parity with docker-compose.yml; prebuilt images only.
name: doctus
x-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  db:
    image: doctus-db:${DOCTUS_VERSION:-latest}
    container_name: doctus-db
    restart: always
    logging: *id001
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 30s
      timeout: 5s
      retries: 5
  redis:
    image: doctus-redis:${DOCTUS_VERSION:-latest}
    container_name: doctus-redis
    restart: always
    logging: *id001
    ports:
    - 127.0.0.1:6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 5s
      retries: 5
  ollama:
    image: doctus-ollama:${DOCTUS_VERSION:-latest}
    container_name: doctus-ollama
    restart: always
    logging: *id001
    ports:
    - 127.0.0.1:11434:11434
    environment:
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_MAX_LOADED_MODELS: '2'
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    volumes:
    - ./data/ollama:/root/.ollama
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'exec 3<>/dev/tcp/localhost/11434'
      interval: 30s
      timeout: 5s
      retries: 5
  backend-api:
    image: doctus-backend-api:${DOCTUS_VERSION:-latest}
    mem_limit: ${BACKEND_MEM_LIMIT:-3g}
    container_name: doctus-backend
    restart: always
    logging: *id001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - 8000:8000
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      KNOWLEDGE_GRAPH_OVERVIEW_MAX_NODES: ${KNOWLEDGE_GRAPH_OVERVIEW_MAX_NODES:-10000}
      KNOWLEDGE_GRAPH_OVERVIEW_MAX_CODE_EDGES: ${KNOWLEDGE_GRAPH_OVERVIEW_MAX_CODE_EDGES:-100000}
      INFERENCE_MAX_CONCURRENCY: ${INFERENCE_MAX_CONCURRENCY:-4}
      INFERENCE_CHAT_RESERVE: ${INFERENCE_CHAT_RESERVE:-1}
      INFERENCE_BATCH_RESERVE: ${INFERENCE_BATCH_RESERVE:-1}
      INFERENCE_CHAT_WAIT_SECONDS: ${INFERENCE_CHAT_WAIT_SECONDS:-30}
      INFERENCE_BATCH_WAIT_SECONDS: ${INFERENCE_BATCH_WAIT_SECONDS:-900}
      LEGACY_OLLAMA_SERVICE: ${LEGACY_OLLAMA_SERVICE:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-${OLLAMA_BASE_URL:-http://ollama:11434}}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OLLAMA_API_KEY:-}}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_AUTO_PULL: ${EMBEDDING_AUTO_PULL:-false}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_CONTEXT_LENGTH: ${EMBEDDING_CONTEXT_LENGTH:-8100}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      CUSTOM_CA_BUNDLE: /certs/custom-ca.pem
      GIT_SSL_CAINFO: ${GIT_SSL_CAINFO:-/etc/ssl/certs/ca-certificates.crt}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
      FOLDER_MAX_FILE_MB: ${FOLDER_MAX_FILE_MB:-200}
      DOC_CONCURRENCY: ${DOC_CONCURRENCY:-0}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-100}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      BOOTSTRAP_SUPERUSER: ${BOOTSTRAP_SUPERUSER:-admin}
      BOOTSTRAP_SUPERUSER_PASSWORD: ${BOOTSTRAP_SUPERUSER_PASSWORD:-}
      BOOTSTRAP_SUPERUSER_EMAIL: ${BOOTSTRAP_SUPERUSER_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL}
      API_URL: ${API_URL:-http://localhost:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_AUDIT_RETENTION_DAYS: ${MCP_AUDIT_RETENTION_DAYS:-90}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      FEATURES_CONFIG_PATH: ${FEATURES_CONFIG_PATH:-/config/features.json}
      LLM_MODEL: ${LLM_MODEL:-disabled}
      LOG_FILE_PATH: /var/log/doctus/backend-api/backend-api.log
      ALLOW_CLOUD_LLM: ${ALLOW_CLOUD_LLM:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DEFAULT_TEAM: ${OIDC_DEFAULT_TEAM:-}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
      OIDC_ADMIN_ROLES: ${OIDC_ADMIN_ROLES:-}
      OIDC_TEAM_MAPPING: ${OIDC_TEAM_MAPPING:-}
    volumes:
    - ./repos:/repos
    - ${WATCHED_FOLDER:-/tmp/doctus-watched}:/watched:ro
    - ${CUSTOM_CA_FILE:-/dev/null}:/certs/custom-ca.pem:ro
    - ./config:/config:ro
    - ./data/logs/backend-api:/var/log/doctus/backend-api
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
  parser-worker:
    image: doctus-parser-worker:${DOCTUS_VERSION:-latest}
    container_name: doctus-parser
    restart: always
    logging: *id001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      INFERENCE_MAX_CONCURRENCY: ${INFERENCE_MAX_CONCURRENCY:-4}
      INFERENCE_CHAT_RESERVE: ${INFERENCE_CHAT_RESERVE:-1}
      INFERENCE_BATCH_RESERVE: ${INFERENCE_BATCH_RESERVE:-1}
      INFERENCE_CHAT_WAIT_SECONDS: ${INFERENCE_CHAT_WAIT_SECONDS:-30}
      INFERENCE_BATCH_WAIT_SECONDS: ${INFERENCE_BATCH_WAIT_SECONDS:-900}
      EMBED_CONCURRENCY: ${EMBED_CONCURRENCY:-3}
      PARSE_WORKERS: ${PARSE_WORKERS:-3}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-${OLLAMA_BASE_URL:-http://ollama:11434}}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OLLAMA_API_KEY:-}}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_AUTO_PULL: ${EMBEDDING_AUTO_PULL:-false}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_CONTEXT_LENGTH: ${EMBEDDING_CONTEXT_LENGTH:-8100}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      CUSTOM_CA_BUNDLE: /certs/custom-ca.pem
      GIT_SSL_CAINFO: ${GIT_SSL_CAINFO:-/etc/ssl/certs/ca-certificates.crt}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
      FOLDER_MAX_FILE_MB: ${FOLDER_MAX_FILE_MB:-200}
      GIT_MAX_FILE_MB: ${GIT_MAX_FILE_MB:-2}
      DOC_CONCURRENCY: ${DOC_CONCURRENCY:-0}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-100}
      LLM_MODEL: ${LLM_MODEL:-disabled}
      COMPLIANCE_LLM_TIMEOUT: ${COMPLIANCE_LLM_TIMEOUT:-180}
      LOG_FILE_PATH: /var/log/doctus/parser-worker/parser-worker.log
      ALLOW_CLOUD_LLM: ${ALLOW_CLOUD_LLM:-}
      LEGACY_OLLAMA_SERVICE: ${LEGACY_OLLAMA_SERVICE:-true}
    volumes:
    - ./repos:/repos
    - ${WATCHED_FOLDER:-/tmp/doctus-watched}:/watched:ro
    - ${CUSTOM_CA_FILE:-/dev/null}:/certs/custom-ca.pem:ro
    - ./data/logs:/var/log/doctus
    mem_limit: ${PARSER_MEM_LIMIT:-5g}
    command:
    - celery
    - -A
    - worker
    - worker
    - --loglevel=info
    - --queues=celery
    - --concurrency=${PARSER_CONCURRENCY:-4}
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A worker inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q OK
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
  link-worker:
    extends:
      service: parser-worker
    container_name: doctus-link-worker
    command:
    - celery
    - -A
    - worker
    - worker
    - --loglevel=info
    - --queues=global_link_runs
    - --concurrency=1
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A worker inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q OK
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
  parser-beat:
    image: doctus-parser-worker:${DOCTUS_VERSION:-latest}
    container_name: doctus-beat
    restart: always
    logging: *id001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    command:
    - celery
    - -A
    - worker
    - beat
    - --loglevel=info
    - --scheduler=celery.beat:PersistentScheduler
    - --schedule=/tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      CUSTOM_CA_BUNDLE: /certs/custom-ca.pem
      GIT_SSL_CAINFO: ${GIT_SSL_CAINFO:-/etc/ssl/certs/ca-certificates.crt}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
      FOLDER_MAX_FILE_MB: ${FOLDER_MAX_FILE_MB:-200}
      DOC_CONCURRENCY: ${DOC_CONCURRENCY:-0}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-100}
      LLM_MODEL: ${LLM_MODEL:-disabled}
      LOG_FILE_PATH: /var/log/doctus/parser-beat/parser-beat.log
      LEGACY_OLLAMA_SERVICE: ${LEGACY_OLLAMA_SERVICE:-true}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-${OLLAMA_BASE_URL:-http://ollama:11434}}
    volumes:
    - ${WATCHED_FOLDER:-/tmp/doctus-watched}:/watched:ro
    - ${CUSTOM_CA_FILE:-/dev/null}:/certs/custom-ca.pem:ro
    - ./data/logs/parser-beat:/var/log/doctus/parser-beat
    healthcheck:
      test:
      - CMD
      - python3
      - healthcheck_beat.py
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
  frontend:
    image: doctus-frontend:${DOCTUS_VERSION:-latest}
    container_name: doctus-frontend
    restart: always
    logging: *id001
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
    - 3000:3000
    environment:
      API_URL: ${API_URL}
      INTERNAL_API_URL: http://backend-api:8000
      NEXT_TELEMETRY_DISABLED: '1'
      HOSTNAME: 0.0.0.0
    volumes:
    - ./data/logs/frontend:/var/log/doctus/frontend
    command:
    - sh
    - -c
    - npm run start 2>&1 | tee -a /var/log/doctus/frontend/frontend.log
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'require(''http'').get(''http://localhost:3000'', r => process.exit(r.statusCode < 500 ? 0 : 1)).on(''error'', () => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
volumes: {}
