# CODENA_CI_RUNNER points at scripts/publish_maven_ci.py from the delivered
# ci-runner directory or a checkout of the Codena tools on this runner.
maven-verify:
  stage: test
  tags: [java]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - python3 "$CODENA_CI_RUNNER" --variant jdk21-default --java-version 21
  variables:
    MAVEN_PROFILES: ""
  # Configure CODENA_URL, CODENA_SOURCE_ID and masked CODENA_CI_TOKEN in CI settings.
