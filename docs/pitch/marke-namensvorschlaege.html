<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Namen und Marke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Chivo:wght@400;700;900&family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;700;800&family=Outfit:wght@200;300;400;600&family=Shippori+Mincho:wght@500;700;800&family=Sora:wght@300;400;600;700&family=Space+Grotesk:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  /* Jede Konzeptfolie setzt ihre eigenen Tokens (--bg, --fg, ...) inline; die Rahmenfolien nutzen diese hier. */
  :root{
    --bg:#111214; --fg:#EDEDEA; --muted:#A3A39C; --card:#1A1B1E; --line:rgba(237,237,234,.14);
    --accent:#EDEDEA; --on-accent:#111214; --r:10px;
    --fd:'Inter Tight',system-ui,sans-serif; --fb:'Inter Tight',system-ui,sans-serif; --fm:'JetBrains Mono',ui-monospace,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html{font-size:clamp(14px,0.45vw + 9px,18px);scroll-behavior:smooth;}
  @media (min-width:1000px) and (min-height:700px){html{scroll-snap-type:y mandatory;}}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
  body{margin:0;background:#111214;color:#EDEDEA;font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  p,blockquote,h1,h2,h3,ul{margin:0;}
  button{font:inherit;color:inherit;}

  #progress{position:fixed;inset:0 0 auto 0;height:3px;z-index:20;background:rgba(128,128,128,.25);}
  #progress span{display:block;height:100%;width:0;background:#EDEDEA;mix-blend-mode:difference;transition:width .18s ease;}
  #dots{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:8px;
    padding:8px 6px;border-radius:999px;background:rgba(20,20,22,.55);backdrop-filter:blur(6px);}
  #dots a{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);display:block;}
  #dots a.on{background:#fff;transform:scale(1.25);}
  @media (max-width:700px){#dots{display:none;}}

  .slide{
    min-height:100svh;scroll-snap-align:start;display:flex;align-items:center;
    background:var(--bg);color:var(--fg);font-family:var(--fb);
    padding-block:clamp(2.2rem,5vh,4rem);
    padding-inline:max(16px,4.5vw);
    position:relative;overflow:hidden;
  }
  .inner{width:100%;max-width:84rem;margin:0 auto;display:flex;flex-direction:column;gap:1.6rem;position:relative;z-index:1;}
  .top{display:flex;justify-content:space-between;align-items:center;gap:1rem;}
  .kicker{font-family:var(--fm);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .fav{
    border:1px solid var(--line);background:transparent;border-radius:999px;padding:.4rem .9rem;cursor:pointer;
    font-family:var(--fb);font-size:.85rem;color:var(--fg);display:inline-flex;gap:.4rem;align-items:center;
  }
  .fav[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
  .fav:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.22fr);gap:clamp(1.5rem,3.5vw,3.5rem);align-items:start;}
  @media (max-width:1000px){.grid{grid-template-columns:1fr;}}

  .hero{display:flex;flex-direction:column;gap:1.15rem;padding-top:.4rem;}
  .lockup{display:inline-flex;align-items:center;gap:.32em;line-height:1;white-space:nowrap;}
  .lockup svg{flex:none;width:1.05em;height:1.05em;}
  .hero .lockup{font-size:calc(clamp(2.6rem,5.2vw,4.9rem) * var(--hs,1));}
  .wm{display:inline-block;}
  .pron{font-family:var(--fm);font-size:.82rem;color:var(--muted);letter-spacing:.02em;}
  .motto{font-family:var(--fd);font-size:clamp(1.45rem,2.3vw,2.05rem);line-height:1.22;font-weight:var(--motto-w,500);
    font-style:var(--motto-i,normal);text-wrap:balance;border-left:3px solid var(--accent);padding-left:1rem;}
  .story{font-size:1.02rem;line-height:1.6;max-width:44ch;color:var(--fg);opacity:.92;}
  .check{font-size:.86rem;line-height:1.5;color:var(--muted);max-width:50ch;}
  .check b{color:var(--fg);font-weight:600;margin-right:.35em;}

  .guide{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;}
  @media (max-width:640px){.guide{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.05rem;display:flex;flex-direction:column;gap:.7rem;min-width:0;}
  .card.wide{grid-column:1/-1;}
  .card h3{font-family:var(--fb);font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}

  .pal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.55rem;}
  @media (max-width:520px){.pal{grid-template-columns:repeat(3,minmax(0,1fr));}}
  .sw{display:flex;flex-direction:column;gap:.35rem;min-width:0;}
  .sw i{display:block;height:2.6rem;border-radius:calc(var(--r) * .6);border:1px solid var(--line);}
  .sw b{font-size:.78rem;font-weight:600;}
  .sw span{font-family:var(--fm);font-size:.7rem;color:var(--muted);}

  .type{display:flex;flex-direction:column;gap:.55rem;}
  .type .row{display:flex;align-items:baseline;gap:.8rem;min-width:0;}
  .type .aa{font-size:2.3rem;line-height:1;flex:none;width:3.2rem;}
  .type .lbl{font-size:.74rem;color:var(--muted);line-height:1.35;}
  .type .lbl b{display:block;color:var(--fg);font-size:.86rem;font-weight:600;}
  .type .mono{font-family:var(--fm);font-size:.82rem;}

  .marks{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
  .tile{border-radius:calc(var(--r) * .6);padding:.85rem .7rem;display:flex;align-items:center;justify-content:center;min-height:4.4rem;border:1px solid var(--line);overflow:hidden;}
  .tile .lockup{font-size:1.45rem;}
  .tile.icons{grid-column:1/-1;gap:1rem;justify-content:flex-start;padding-inline:1rem;}
  .app{display:grid;place-items:center;flex:none;}
  .app svg{width:62%;height:62%;}
  .tile.icons small{font-size:.72rem;color:var(--muted);margin-left:auto;text-align:right;line-height:1.35;}

  .mock{border-radius:calc(var(--r) * .7);overflow:hidden;border:1px solid var(--line);background:var(--mock-bg,var(--bg));color:var(--mock-fg,var(--fg));font-size:.82rem;}
  .mock-bar{display:flex;align-items:center;justify-content:space-between;padding:.5rem .7rem;border-bottom:1px solid var(--line);}
  .mock-bar .lockup{font-size:1rem;}
  .mock-bar .pills{display:flex;gap:.3rem;}
  .mock-bar .pills i{width:.45rem;height:.45rem;border-radius:50%;background:var(--muted);opacity:.5;display:block;}
  .mock-body{padding:.75rem;display:flex;flex-direction:column;gap:.6rem;}
  .q{align-self:flex-end;background:var(--card);border:1px solid var(--line);padding:.45rem .7rem;border-radius:calc(var(--r) * .7);max-width:85%;}
  .a{line-height:1.5;}
  .a code{font-family:var(--fm);font-size:.92em;}
  .cites{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem;}
  .cite{font-family:var(--fm);font-size:.74rem;padding:.2rem .5rem;border-radius:calc(var(--r) * .45);background:var(--accent);color:var(--on-accent);}

  .rules{list-style:none;padding:0;display:flex;flex-direction:column;gap:.55rem;font-size:.86rem;line-height:1.45;}
  .rules li{display:grid;grid-template-columns:1.2rem 1fr;}
  .rules li::before{content:"";width:.5rem;height:.5rem;margin-top:.42em;background:var(--accent);border-radius:var(--bullet-r,0);}
  .tone{display:flex;flex-wrap:wrap;gap:.35rem;}
  .tone span{font-size:.74rem;padding:.2rem .6rem;border:1px solid var(--line);border-radius:999px;color:var(--fg);}

  /* Kurrent: blinkender Schreibcursor hinter der Wortmarke */
  .caret{display:inline-block;width:.09em;height:.82em;margin-left:.06em;transform:translateY(.06em);background:var(--accent);animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  @media (prefers-reduced-motion:reduce){.caret{animation:none;}}

  .kep-orig{width:min(19rem,70vw);aspect-ratio:1/1;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--line);}
  .kep-orig img{width:100%;height:100%;object-fit:cover;display:block;}
  .kep-cap{font-family:var(--fm);font-size:.72rem;color:var(--muted);}

  /* Deckblatt und Auswahl */
  .frame h1{font-family:'Inter Tight',sans-serif;font-size:clamp(2.6rem,6vw,5rem);line-height:1.02;letter-spacing:-.03em;font-weight:700;}
  .frame .lead{font-size:clamp(1.05rem,1.6vw,1.35rem);line-height:1.5;color:var(--muted);max-width:52ch;}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;}
  @media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media (max-width:560px){.tiles{grid-template-columns:1fr;}}
  .pick{display:flex;flex-direction:column;gap:.75rem;padding:1.1rem 1.15rem;border-radius:12px;text-decoration:none;
    background:var(--bg);color:var(--fg);border:1px solid var(--line);position:relative;min-width:0;transition:transform .15s ease;}
  a.pick:hover{transform:translateY(-2px);}
  .pick .lockup{font-size:1.9rem;}
  .pick .nr{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);}
  .pick .m{font-family:var(--fd);font-size:1.02rem;line-height:1.35;font-style:var(--motto-i,normal);}
  .pick .pro,.pick .con{font-family:var(--fb);font-size:.8rem;line-height:1.45;color:var(--muted);}
  .pick .pro b,.pick .con b{color:var(--fg);font-weight:600;}
  .pick .fav{position:absolute;top:.8rem;right:.8rem;padding:.25rem .6rem;font-size:.78rem;}
  .pick.is-fav{outline:2px solid var(--accent);outline-offset:3px;}
  #favsum{font-size:1rem;color:var(--muted);}
  #favsum b{color:#EDEDEA;}
  .hint{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);}
</style>
</head>

            <div class="tile" style="background:${b.light.bg}">${lockup(b,b.light).replace('class="lockup"','class="lockup" style="font-size:1.05rem;color:'+b.light.fg+'"')}</div>
            <div class="tile" style="background:${b.dark.bg}">${lockup(b,b.dark).replace('class="lockup"','class="lockup" style="font-size:1.05rem;color:'+b.dark.fg+'"')}</div>
            <div class="tile icons" style="background:${b.t.bg}">${appIcon(52,12)}${appIcon(32,8)}${appIcon(20,5)}<small>App-Icon<br>52 · 32 · 20 px</small></div>
          </div>
        </div>
        <div class="card">
          <h3>Anwendung</h3>
          <div class="mock">
            <div class="mock-bar">${lockup(b,hc)}<span class="pills"><i></i><i></i><i></i></span></div>
            <div class="mock-body">
              <div class="q">Wo wird der Verzugszins berechnet?</div>
              <div class="a">Im Paragraph <code>2100-ZINS-BERECHNEN</code> von <code>ZINSLAUF</code>, aufgerufen aus <code>2000-VERARBEITUNG</code>.
                <div class="cites"><span class="cite" style="${b.citeCss}">ZINSLAUF.cbl:412</span><span class="cite" style="${b.citeCss}">ZINSLAUF.cbl:233</span></div>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <h3>Leitlinien</h3>
          <ul class="rules">${b.rules.map(r=>`<li>${r}</li>`).join('')}</ul>
          <div class="tone">${b.tone.map(t=>`<span>${t}</span>`).join('')}</div>
        </div>
      </div>
    </div>
  </div>
</section>`;
}

const pickCard=(b,i,withFav)=>{
  const c={...(['densho','kurrent','locus','codena'].includes(b.id)?b.light:b.dark),bg:b.t.bg};
  return `<${withFav?'div':'a href="#'+b.id+'"'} class="pick" data-pick="${b.id}" style="${brandVars(b)}">
    <span class="nr">${String(i+1).padStart(2,'0')} · ${b.kind}</span>
    ${lockup(b,c)}
    ${withFav?`<span class="m">${b.motto}</span>
      <span class="pro"><b>Stärke:</b> ${b.pro}</span><span class="con"><b>Haken:</b> ${b.con}</span>
      <button class="fav" data-fav="${b.id}" aria-pressed="false">☆</button>`:''}
  </${withFav?'div':'a'}>`;
};

const cover=`
<section class="slide frame" id="start">
  <div class="inner">
    <span class="kicker">Namensfindung · ${BRANDS.length} Konzepte</span>
    <h1>Name, Schrift, Logo,<br>Leitlinien.</h1>
    <p class="lead">Jede Folie ist ein komplettes Markenkonzept. Am Ende steht die Auswahl: Favoriten markieren und ein Motto wählen.</p>
    <div class="tiles">${BRANDS.map((b,i)=>pickCard(b,i,false)).join('')}</div>
    <span class="hint">↓ scrollen · ← → blättern · ☆ Favorit markieren</span>
  </div>
</section>`;

const choice=`
<section class="slide frame" id="auswahl">
  <div class="inner">
    <span class="kicker">Auswahl</span>
    <h1 style="font-size:clamp(2.2rem,4.5vw,3.6rem)">Welches Motto tragen wir?</h1>
    <p id="favsum">Noch keine Favoriten markiert.</p>
    <div class="tiles">${BRANDS.map((b,i)=>pickCard(b,i,true)).join('')}</div>
    <span class="hint">Favoriten werden nur in diesem Browser gemerkt. Markenhinweise sind Einschätzungen, keine Markenrecherche.</span>
  </div>
</section>`;

document.getElementById('deck').innerHTML = cover + BRANDS.map(brandSlide).join('') + choice;

/* Favoriten */
const KEY='doctus-brand-favs';
let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));}catch(e){}
function renderFavs(){
  document.querySelectorAll('[data-fav]').forEach(btn=>{
    const on=favs.has(btn.dataset.fav);
    btn.setAttribute('aria-pressed',on);
    btn.textContent=btn.closest('.pick')?(on?'★':'☆'):(on?'★ Favorit':'☆ Favorit');
  });
  document.querySelectorAll('[data-pick]').forEach(c=>c.classList.toggle('is-fav',favs.has(c.dataset.pick)&&!c.matches('a')));
  const names=BRANDS.filter(b=>favs.has(b.id)).map(b=>b.name);
  document.getElementById('favsum').innerHTML=names.length?`Favoriten: <b>${names.join(' · ')}</b>`:'Noch keine Favoriten markiert.';
}
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-fav]'); if(!btn) return;
  e.preventDefault();
  const id=btn.dataset.fav; favs.has(id)?favs.delete(id):favs.add(id);
  try{localStorage.setItem(KEY,JSON.stringify([...favs]));}catch(e){}
  renderFavs();
});
renderFavs();

/* Navigation: Fortschritt, Punkte, Pfeiltasten */
const slides=[...document.querySelectorAll('.slide')];
const dots=document.getElementById('dots');
dots.innerHTML=slides.map(s=>`<a href="#${s.id}" title="${s.dataset.name||s.id}"></a>`).join('');
const dotEls=[...dots.children];
function current(){const y=window.scrollY+innerHeight*.4;let k=0;slides.forEach((s,i)=>{if(s.offsetTop<=y)k=i;});return k;}
function onScroll(){
  const max=document.documentElement.scrollHeight-innerHeight;
  document.querySelector('#progress span').style.width=(max>0?scrollY/max*100:0)+'%';
  const k=current(); dotEls.forEach((d,i)=>d.classList.toggle('on',i===k));
}
addEventListener('scroll',onScroll,{passive:true}); onScroll();
addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')) return;
  const k=current();
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    e.preventDefault();
    const n=Math.max(0,Math.min(slides.length-1,k+(e.key==='ArrowRight'?1:-1)));
    slides[n].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  }
});
</script>
</body>
</html>
