": "383", "avg_bytes": "2680"}, {"tool": "get_code_entity", "n": "14", "avg_ms": "35", "p95_ms": "48", "avg_bytes": "334"}, {"tool": "search_knowledge", "n": "5", "avg_ms": "1403", "p95_ms": "4547", "avg_bytes": "4688"}, {"tool": "research_project", "n": "2", "avg_ms": "79", "p95_ms": "106", "avg_bytes": "4745"}]}, "N": {"lead": "Die MCP-Schnittstelle wurde überarbeitet (ein Werkzeug <code>explain_symbol<\/code> mit Quelltext, Aufrufern, Aufgerufenen und Datenzugriffen, tolerante Namenssuche, kompakte Treffer) und mit denselben sechs Fragen und denselben Modellen neu gemessen. Das Ergebnis ist zweigeteilt: Für das kleine Modell verbessert sich die Qualität deutlich. Der erhoffte Gewinn an Zügen, Zeit und Tokens ist insgesamt nicht eingetreten, bei Einzelfragen aber sichtbar.", "findings": ["<b>Qwen3-8B: Qualität.<\/b> Mit MCP v2 erfüllt Qwen 45 % der Rubrikpunkte statt 20 % mit MCP v1 (+25,7 Prozentpunkte, Intervall +3,4 bis +48,8, p = 0,0003). Gegenüber den lokalen Dateitools (8 %) sind es +36,7 Prozentpunkte (p &lt; 0,0001). Das ist die einzige der vier vorab festgelegten Hypothesen, die sich bestätigt hat. Am stärksten verbessern sich J3 (0,09 → 0,73), C1 (0,00 → 0,53), J1 (0,23 → 0,45) und J2 (0,00 → 0,27).", "<b>Qwen3-8B: Aufwand.<\/b> Aufrufe (3,0 statt 3,4), Zeit (18 s statt 14 s) und Eingabe-Tokens (13.100 statt 11.700) ändern sich nicht belastbar. Qwen beginnt weiter meist mit <code>search_code<\/code> (24 von 30 Sitzungen) und ruft <code>explain_symbol<\/code> erst danach auf. Leere Suchen sind von 0,93 auf 0,30 je Sitzung gefallen.", "<b>GPT-6-Luna: Qualität.<\/b> Unverändert bei 92 % (Differenz +0,1 Prozentpunkte). Die Nichtunterlegenheit gegenüber MCP v1 mit der Grenze −5 Prozentpunkte ist nicht gezeigt, weil die untere Intervallgrenze bei −7,5 Prozentpunkten liegt. Bei C3 liegt MCP v2 mit 0,83 klar unter der Shell (1,00).", "<b>GPT-6-Luna: Aufwand.<\/b> Insgesamt kein belastbarer Unterschied zu MCP v1: Aufrufe 8,7 statt 7,9, Zeit 37 s statt 35 s, Eingabe-Tokens 110.300 statt 127.800 (−14 %, p = 0,10). Gegenüber den lokalen Werkzeugen braucht MCP v2 weiter mehr als doppelt so viele Aufrufe (8,7 gegen 4,1, p = 0,0001) und 32 % mehr Eingabe-Tokens (p = 0,004), bei gleicher Zeit (37 gegen 38 s).", "<b>Wo der Ein-Aufruf-Ansatz trägt:<\/b> Bei Fragen zu einer einzelnen Methode oder Programmeinheit halbiert sich der Aufwand. Luna braucht bei J1 3,0 statt 7,2 Aufrufe (Eingabe-Tokens 139.800 → 70.900, −49 %) und bei C1 1,6 statt 3,8 (64.200 → 45.600). Hier wird aus „Dateien durchsuchen“ tatsächlich ein einziger Nachschlagezugriff.", "<b>Wo er nicht trägt:<\/b> Bei Fragen über ein ganzes COBOL-Programm. Luna bekommt zuerst eine Gliederung und fragt dann jeden Paragraphen einzeln ab: C2 braucht 13,6 statt 8,8 Aufrufe, C3 15,0 statt 10,2, mit 11 und 13 <code>explain_symbol<\/code>-Aufrufen. Die Shell liest dieselbe Datei mit 3 bis 5 Befehlen am Stück. Die Gliederung spart Qwen Kontext und kostet Luna Züge.", "<b>Der Server ist nicht der Engpass.<\/b> <code>explain_symbol<\/code> antwortet im Mittel in 101 ms (p95 219 ms) mit 3.800 Zeichen. Die Wandzeit entsteht fast vollständig in den Modellzügen, jeder zusätzliche Aufruf kostet daher etwa 4 Sekunden Modellzeit (Luna, gemessen in Kapitel 2), nicht Serverzeit.", "<b>Messqualität:<\/b> Die lokale Kontrolle vom selben Tag unterscheidet sich kaum von Kapitel 1 und 2 (Rubrik −0,2 bzw. −1,2 Prozentpunkte). Zeitverschiebungen zwischen den Kapiteln sind damit klein, die Vorher-Nachher-Vergleiche tragen."], "next": ["<b>Alle Paragraphen eines Programms in einem Aufruf<\/b> (mit Budget): <code>explain_symbol<\/code> liefert für ein Programm oder eine Klasse zusätzlich zur Gliederung die Quelltexte der Einheiten, die am meisten Fakten tragen, bis zum Budget. Das zielt auf C2, C3 und J2, wo Luna heute 8 bis 13 Aufrufe braucht.", "<b>Die Gliederung ersetzen, wenn das Programm in das Budget passt:<\/b> Unterhalb von etwa 25.000 Zeichen das ganze Programm mit Zeilennummern liefern, wie es die Shell mit einem <code>sed<\/code> tut. Bei Qwen braucht es dafür eine kleinere Antwort je Aufruf.", "<b>Qwen früher auf <code>explain_symbol<\/code> lenken:<\/b> Server-Hinweise (<code>instructions<\/code>) kommen im eigenen Harness nicht an. Dort müsste der Systemtext den Hinweis enthalten, oder <code>search_code<\/code> liefert bei exaktem Treffer schon den Kontext von <code>explain_symbol<\/code>.", "<b>Fakten beim Indexieren berechnen<\/b> (nicht umgesetzt): Ablehnungscodes, Meldungstexte und Weiterleitungsziele als strukturierte Karte je Programm. C3 und die Hälfte von C1 hängen an solchen Konstanten, die der Index heute nicht kennt."], "method": ["<b>Festlegung vorab:<\/b> Hypothesen, Prüfsummen von Aufgaben und Server-Code und der Plan wurden vor der Messung in <code>manifest_ch3.json<\/code> abgelegt (Backend-Stand <code>dc7d3df<\/code>, Aufgaben-Prüfsumme wie in Kapitel 1 und 2).", "<b>Design:<\/b> Je Modell 6 Aufgaben × 2 Varianten (lokale Werkzeuge als Tageskontrolle, MCP v2) × 5 Wiederholungen = 60 Sitzungen. Verglichen wird MCP v2 mit MCP v1 aus Kapitel 1 und 2, gepaart nach Aufgabe und Wiederholung, und mit der Tageskontrolle.", "<b>Statistik:<\/b> Wie in Kapitel 1 und 2 (gepaarte Differenzen, Bootstrap-Intervall über Aufgaben, exakter Permutationstest). Für die vier Hauptkennzahlen gilt p &lt; 0,0125. Die Nichtunterlegenheit bei Luna wird mit einer Grenze von −5 Prozentpunkten an der unteren Intervallgrenze geprüft.", "<b>Umgebung:<\/b> Qwen wie in Kapitel 1. Für Luna wurde <code>qwen3:8b<\/code> vorher entladen, damit <code>bge-m3<\/code> im Speicher bleibt (Kapitel 2 lief mit beiden Modellen im VRAM).", "<b>Abweichungen:<\/b> Eine lokale Qwen-Sitzung (J1, Wiederholung 1) fiel durch einen Speicherfehler (Linux-OOM-Kill des Ollama-Prozesses, HTTP 500) aus und wurde mit gleichem Seed wiederholt. Während der Entwicklung wurde die Schnittstelle nach einem Pilot an vier Qwen-Fragen noch einmal angepasst (<code>detail<\/code> entfernt, <code>explain_symbol<\/code> an die erste Stelle). Die gewertete Messung lief danach unverändert. Die Fehlerfreiheit aller Luna-Sitzungen und fehlende Leckage-Markierungen sind geprüft."], "limits": ["Die Vorher-Nachher-Paare liegen zeitlich getrennt (Kapitel 1 und 2 gegen Kapitel 3). Die Tageskontrolle zeigt keine auffällige Drift, ausschließen lässt sie sich nicht, bei Luna besonders für die Cloud-Zeiten.", "Qwen sieht nur die Werkzeugbeschreibungen, Luna zusätzlich die Server-Hinweise. Der Vergleich zwischen den Modellen ist deshalb nicht rein.", "Die Schnittstelle wurde unter Kenntnis der Kapitel-1-und-2-Ergebnisse entworfen und am selben Aufgabensatz gemessen. Ein Teil des Gewinns kann auf diese Aufgaben zugeschnitten sein. Eine Prüfung an neuen Fragen steht aus.", "Sechs Aufgaben, fünf Wiederholungen. Aufgabenweise Zahlen sind beschreibend. Die Rubrik prüft Begriffe und nicht Bedeutung.", "Der erwartete Vorteil des Index beim Maßstab (zweistellige GB) wurde nicht gemessen."]}}, "v2": {"title": "MCP im Benchmark: Qwen und Luna, vier Fassungen der Schnittstelle", "lead": "Qwen3-8B (lokal) und GPT-6-Luna (Codex CLI) beantworten Fragen zu COBOL- und Java-Code, ohne Werkzeuge, mit lokalen Dateiwerkzeugen und mit der Doctus-MCP-Schnittstelle. Gemessen wurden v1, die Überarbeitung v2 und für Qwen zwei weitere Fassungen, bei denen der Server die Arbeit übernimmt (v3, v4/v4.1). Alles zuerst an sechs Entwicklungsfragen, dann an zehn neuen Fragen. Unten stehen die Ergebnisse je Modell in acht Kapiteln, am Ende der Vergleich.", "top": ["<b>Qwen:<\/b> Wenn der Server den Evidenz-Pack selbst als ersten Schritt ausführt (v4/v4.1), antwortet Qwen in 23 s statt 32 s und mit 3.500 statt 4.600 Tokens je Antwort (beides belegt gegenüber v3). Die Qualität liegt an den neuen Fragen bei 37 % bis 40 % gegenüber 36 % bei v3, das ist <b>kein belegter Unterschied<\/b>. Gegenüber v2 (17 %) ist der Gewinn belegt.", "<b>Luna:<\/b> Mit Werkzeugen bleibt sie weit vorn (74 % bis 81 %), MCP v2 liegt aber auch an neuen Fragen hinter der lokalen Shell. Die neuen Fassungen wurden bei Luna nicht gemessen.", "<b>Wichtigste Lehre:<\/b> Verbesserungen, die ich an einer Frage diagnostiziert habe, wirken an dieser Frage (C1: 2 % → 62 %), verschlechtern aber andere (C4: 21 % → 0 %). Ein belegter Qualitätsgewinn braucht neue, unberührte Fragen."], "qwen": {"lead": "Ein kleines Modell auf der lokalen 8-GB-GPU. Es hat ohne Hilfe kaum Chancen. Die Frage ist, ob die Schnittstelle es nutzbar macht.", "findings": ["<b>Qualität.<\/b> Anteil der erfüllten Rubrikpunkte: ohne Werkzeuge 18 %, lokale Dateiwerkzeuge 9 %, MCP v1 20 %, MCP v2 45 %. Der Sprung von v1 zu v2 beträgt +25,7 Prozentpunkte (Intervall +3,4 bis +48,8, p = 0,0003). Das ist die einzige der vier vorab festgelegten Erwartungen, die sich bestätigt hat.", "<b>Brauchbare Antworten<\/b> (mindestens 50 % der Punkte): ohne Werkzeuge 0 von 30, lokale Werkzeuge 1 von 30, MCP v1 7 von 30, MCP v2 10 von 30.", "<b>Wo es besser wurde:<\/b> J3 (0,09 → 0,73), C1 (0,00 → 0,53), J1 (0,23 → 0,45), J2 (0,00 → 0,27). C2 bleibt bei 0,40, C3 fällt von 0,45 auf 0,33.", "<b>Aufwand.<\/b> Aufrufe 3,4 → 3,0, Zeit 14 s → 18 s, Eingabe-Tokens 11.700 → 13.100. Keine dieser Änderungen ist belastbar. Die Zeit liegt tendenziell höher (+3,7 s, p = 0,018, Schwelle 0,0125).", "<b>Werkzeugwahl.<\/b> Qwen beginnt in 24 von 30 Sitzungen mit <code>search_code<\/code> und ruft <code>explain_symbol<\/code> erst danach auf. Leere Suchen sind von 0,93 auf 0,30 je Sitzung gefallen, das erklärt die Java-Verbesserungen."]}, "luna": {"lead": "Ein starkes Modell in der Codex CLI (Reasoning medium, Cloud). Mit Werkzeugen beantwortet es fast alles richtig. Die Frage ist, ob die Schnittstelle den Weg dorthin kürzer macht.", "findings": ["<b>Qualität.<\/b> Ohne Werkzeuge 6 %, lokale Shell 95 %, MCP v1 92 %, MCP v2 92 %. Zwischen v1 und v2 gibt es keinen Unterschied (+0,1 Prozentpunkte). Dass v2 nicht schlechter ist, lässt sich mit der Grenze von −5 Prozentpunkten nicht belegen (untere Intervallgrenze −7,5).", "<b>Brauchbare Antworten:<\/b> ohne Werkzeuge 1 von 30, lokale Shell 30 von 30, MCP v1 30 von 30, MCP v2 29 von 30.", "<b>Einzelfragen: der Ein-Aufruf-Ansatz trägt.<\/b> J1 braucht 3,0 statt 7,2 Aufrufe (Eingabe-Tokens 139.800 → 70.900, −49 %), C1 1,6 statt 3,8.", "<b>Ganze COBOL-Programme: er trägt nicht.<\/b> C2 braucht 13,6 statt 8,8 Aufrufe, C3 15,0 statt 10,2. Luna bekommt zuerst eine Gliederung und fragt dann jeden Paragraphen einzeln ab (11 bzw. 13 Aufrufe von <code>explain_symbol<\/code>). Die Shell liest dieselbe Datei mit 3 bis 5 Befehlen. C3 sinkt dabei von 0,90 auf 0,83.", "<b>Aufwand insgesamt.<\/b> Aufrufe 7,9 → 8,7, Zeit 35 s → 37 s, Eingabe-Tokens 127.800 → 110.300 (−14 %, nicht belastbar, p = 0,10). Der Server antwortet im Mittel in 101 ms, die Zeit entsteht in den Modellzügen (etwa 4 s je Zug)."]}, "compare": {"lead": "Nur die vier Messungen, um die es geht: Qwen v1, Qwen v2, Luna v1, Luna v2. Qualität und brauchbare Antworten lassen sich zwischen den Modellen vergleichen, weil Fragen und Bewertung gleich sind. Zeit und Tokens nicht: Luna läuft in der Cloud mit einem anderen Systemtext, Qwen lokal.", "findings": ["<b>Die Überarbeitung hilft dem kleinen Modell, dem starken kaum.<\/b> Qwen steigt von 20 % auf 45 %, Luna bleibt bei 92 %. Luna lag schon vorher an der Obergrenze, dort ist nichts mehr zu gewinnen.", "<b>Das Modell bleibt wichtiger als die Schnittstelle.<\/b> Luna mit MCP v1 (92 %) liegt weit über Qwen mit MCP v2 (45 %).", "<b>Aufwand:<\/b> Bei keinem der beiden Modelle sinken Aufrufe, Zeit und Tokens belastbar. Nur bei Einzelfragen (Luna: J1, C1) halbiert sich der Aufwand.", "<b>Was noch fehlt:<\/b> Für ganze Programme braucht es einen Aufruf, der mehrere Paragraphen auf einmal liefert (siehe Ausblick)."]}, "next": ["<b>Unabhängige Endprüfung:<\/b> Zehn frische Fragen zu anderen Programmen, Rubrik und Festlegung vor dem Lauf, ein Durchgang mit v4.1. Erst das sagt, ob die Auswahllogik allgemein trägt.", "<b>Mehr Kontext für das Beweispaket:<\/b> Das Paket muss in 8.192 Token Kontext passen (rund 5.500 Zeichen). Mit 16.000 Token wären bessere Antworten wahrscheinlich, das hängt an Arbeitsspeicher und Ollama-Einstellungen (Entscheidung offen).", "<b>Paketgröße auch bei Java einhalten:<\/b> Bei den Entwicklungsfragen wurde das Paket in 9 von 18 Läufen von der Obergrenze des Harness (6.000 Zeichen) abgeschnitten, vor allem bei Java-Methoden mit vielen Aufrufern.", "<b>Den Index verbessern:<\/b> J4 zeigt, dass nur 6 von 13 Aufruferklassen aufgelöst sind. Fehlende Auflösung kostet Punkte.", "<b>Luna mit v4.1 messen<\/b> und die Fassung produktiv bereitstellen, sobald die Endprüfung vorliegt."], "method": ["<b>Festlegung vorab:<\/b> Hypothesen, Prüfsummen von Aufgaben und Server-Code und der Plan wurden vor der Messung in <code>manifest_ch3.json<\/code> abgelegt (Backend-Stand <code>dc7d3df<\/code>, Aufgaben-Prüfsumme wie in Kapitel 1 und 2).", "<b>Design:<\/b> Je Modell 6 Aufgaben × 2 Varianten (lokale Werkzeuge als Tageskontrolle, MCP v2) × 5 Wiederholungen = 60 Sitzungen. Verglichen wird MCP v2 mit MCP v1 aus Kapitel 1 und 2, gepaart nach Aufgabe und Wiederholung, und mit der Tageskontrolle.", "<b>Statistik:<\/b> Wie in Kapitel 1 und 2 (gepaarte Differenzen, Bootstrap-Intervall über Aufgaben, exakter Permutationstest). Für die vier Hauptkennzahlen gilt p &lt; 0,0125. Die Nichtunterlegenheit bei Luna wird mit einer Grenze von −5 Prozentpunkten an der unteren Intervallgrenze geprüft.", "<b>Umgebung:<\/b> Qwen wie in Kapitel 1. Für Luna wurde <code>qwen3:8b<\/code> vorher entladen, damit <code>bge-m3<\/code> im Speicher bleibt (Kapitel 2 lief mit beiden Modellen im VRAM).", "<b>Abweichungen:<\/b> Eine lokale Qwen-Sitzung (J1, Wiederholung 1) fiel durch einen Speicherfehler (Linux-OOM-Kill des Ollama-Prozesses, HTTP 500) aus und wurde mit gleichem Seed wiederholt. Während der Entwicklung wurde die Schnittstelle nach einem Pilot an vier Qwen-Fragen noch einmal angepasst (<code>detail<\/code> entfernt, <code>explain_symbol<\/code> an die erste Stelle). Die gewertete Messung lief danach unverändert. Die Fehlerfreiheit aller Luna-Sitzungen und fehlende Leckage-Markierungen sind geprüft.", "<b>Kapitel 4 (Prüfung):<\/b> Zehn neue Fragen (fünf COBOL, fünf Java) mit Prüfsumme, Rubrik und Hypothesen vor dem ersten Lauf festgelegt. Die Rubriken wurden nur gegen die eigene Sollantwort und das Wiederholen der Frage geprüft. 10 Fragen × 3 Varianten × 3 Wiederholungen je Modell.", "<b>Kapitel 5 (Entwicklung):<\/b> Entwickelt und gemessen nur an den sechs ursprünglichen Fragen, je Bedingung 5 Wiederholungen. Der Entwicklungsserver lief auf einer zweiten Instanz mit gleicher Datenbank, der produktive Server blieb auf v2. Die Auswahlregel (höchste Qualität) wurde vorab festgelegt.", "<b>Kapitel 6 (Test):<\/b> Die ausgewählte Variante wurde einmal an den zehn neuen Fragen gemessen (30 Sitzungen), mit vorab festgelegten Erwartungen, gepaart gegen MCP v2 an denselben Fragen.", "<b>Harnessänderung:<\/b> Nach den ersten 22 Sitzungen von Z1 wurde ein Wiederholungsversuch ergänzt (bis zu zwei Mal mit einem Hinweis), wenn Ollama einen Werkzeugaufruf mit ungültigem JSON verwirft. Die Läufe ohne Wiederholungsversuch sind getrennt abgelegt. In früheren Kapiteln gab es keine leeren Antworten, die Änderung betrifft sie nicht.", "<b>Kapitel 7 (v4):<\/b> Zehn Hold-out-Fragen × 3 Wiederholungen, nur MCP-Arm, mit Prefetch (Frage unverändert an <code>answer_context<\/code>, 5.000 Zeichen), lean Werkzeugliste und Denkmodus. Festlegung vorab in <code>manifest_ch7.json<\/code>, gepaart gegen v3 und v2.", "<b>Kapitel 8 (v4.1):<\/b> Gleiche Konfiguration mit nachgebessertem Server. Festlegung <code>manifest_ch8.json<\/code>, mit dem Hinweis, dass die Änderungen nach Kenntnis der Ergebnisse auf denselben Fragen entstanden. Zusätzlich sechs Entwicklungsfragen × 3 Wiederholungen."], "limits": ["Die Vorher-Nachher-Paare liegen zeitlich getrennt (Kapitel 1 und 2 gegen Kapitel 3). Die Tageskontrolle zeigt keine auffällige Drift, ausschließen lässt sie sich nicht, bei Luna besonders für die Cloud-Zeiten.", "Qwen sieht nur die Werkzeugbeschreibungen, Luna zusätzlich die Server-Hinweise. Der Vergleich zwischen den Modellen ist deshalb nicht rein.", "Die Schnittstelle wurde unter Kenntnis der Kapitel-1-und-2-Ergebnisse entworfen und am selben Aufgabensatz gemessen. Ein Teil des Gewinns kann auf diese Aufgaben zugeschnitten sein. Eine Prüfung an neuen Fragen steht aus.", "Sechs Aufgaben, fünf Wiederholungen. Aufgabenweise Zahlen sind beschreibend. Die Rubrik prüft Begriffe und nicht Bedeutung.", "Der erwartete Vorteil des Index beim Maßstab (zweistellige GB) wurde nicht gemessen.", "<b>Der Testsatz ist nicht völlig unberührt:<\/b> Ich kannte die zehn neuen Fragen, als ich <code>answer_context<\/code> entworfen habe, und habe jede Fähigkeit mit einer der Entwicklungsfragen begründet. Der Sprung bei C5 gilt am wenigsten als unabhängig.", "<b>Qwen wurde mit einer verschlankten Werkzeugliste und im Denkmodus getestet.<\/b> Das ist eine Clientwahl und nicht die Standardeinstellung eines Agenten. Mit allen Werkzeugen wählt Qwen das neue Werkzeug kaum.", "<b>Die neue Schnittstelle wurde mit Luna nicht gemessen<\/b> und ist nicht deployed. Produktiv läuft MCP v2.", "<b>Kapitel 8 ist kein unabhängiger Test:<\/b> Die Nachbesserungen folgen aus der Fehleranalyse derselben Fragen. Dass C1 steigt, ist erwartbar. Ob die Auswahllogik allgemein trägt, zeigt nur ein Test mit neuen Fragen.", "<b>Wörterbuch und Stoppwörter<\/b> (<code>formel<\/code>, <code>buchung<\/code>, „Programm“ …) sind deutsch und COBOL-nah. Für andere Sprachen und Fachgebiete wären sie anzupassen.", "<b>Der Prefetch ist in der Messung ein Harness-Schritt:<\/b> Er ruft denselben Code wie der Chat auf, aber über MCP. Der Chat in Doctus selbst wurde mit einem Modell noch nicht Ende-zu-Ende gemessen.", "<b>Nur Qwen:<\/b> Luna wurde mit v4 und v4.1 nicht gemessen. v4.1 ist committet und auf <code>origin/develop<\/code>, produktiv deployed ist es nicht (dort läuft MCP v2)."], "late": {"title": "MCP im Benchmark: Qwen und Luna, drei Fassungen der Schnittstelle", "lead": "Qwen3-8B (lokal) und GPT-6-Luna (Codex CLI) beantworten Fragen zu COBOL- und Java-Code, ohne Werkzeuge, mit lokalen Dateiwerkzeugen und mit der Doctus-MCP-Schnittstelle. Gemessen wurden die erste Fassung (v1), eine Überarbeitung (v2) und für Qwen eine dritte Fassung (v3), bei der der Server die Arbeit macht. Alles zuerst an sechs Entwicklungsfragen, dann an zehn neuen Fragen. Unten stehen die Ergebnisse je Modell in sechs Kapiteln, am Ende der Vergleich.", "top": ["<b>Qwen:<\/b> An den neuen Fragen steigt die Qualität von 17 % (v2) auf 36 % (v3, schlanke Werkzeugliste mit Denkmodus). Dafür braucht es mehr als doppelt so lange (32 s statt 14 s).", "<b>Luna:<\/b> Mit Werkzeugen bleibt sie weit vorn (74 % bis 81 %), MCP v2 liegt aber auch an neuen Fragen hinter der lokalen Shell. Die neue Schnittstelle wurde bei Luna nicht gemessen.", "<b>Wichtigste Lehre:<\/b> Der Qwen-Vorsprung von v2 an den Entwicklungsfragen (45 %) schrumpfte an neuen Fragen auf 17 %. Erst ein Test an anderen Fragen zeigt, was trägt."], "qwen": {"k4": {"title": "Kapitel 4: Prüfung mit zehn neuen Fragen (MCP v2)", "intro": ["<b>Warum diese Prüfung?<\/b> Die Schnittstelle v2 wurde an den sechs Fragen der ersten Messungen entworfen und nachgebessert. Ob der Gewinn auch bei Fragen trägt, an denen niemand etwas verändert hat, war ungeprüft. Eine Verbesserung, die nur an den Entwicklungsfragen sichtbar ist, wäre Überanpassung.", "<b>Vorgehen:<\/b> Zehn neue Fragen aus denselben zwei Beständen (fünf COBOL aus CardDemo, fünf Java aus Syncope), jeweils mit Quelltext-Beleg, gewichteter Rubrik und Hypothesen, festgelegt und mit Prüfsumme versehen, bevor ein Modell sie gesehen hat. Die Rubriken wurden nur gegen ihre eigene Sollantwort (alle Punkte erfüllt) und gegen das bloße Wiederholen der Frage (kein Punkt) geprüft, nie gegen Modellantworten. Dabei habe ich fünf zu enge Suchmuster verbreitert. Je Modell 10 Fragen × 3 Varianten × 3 Wiederholungen = 90 Sitzungen. Die Fragen decken ganze Programme (Zinsberechnung, Benutzer anlegen, Bericht), einzelne Methoden (Passwortregel, JWT-Prüfung, Job-Ablauf, Benachrichtigung, Menüsteuerung) und zwei Aufzählungsfragen (Aufrufer finden, Copybook samt Verwendern) ab."], "findings": ["<b>Qualität:<\/b> ohne Werkzeuge 2 %, lokale Werkzeuge 7 %, MCP v2 17 %. Der Vorsprung von MCP v2 vor den lokalen Werkzeugen beträgt +10,6 Prozentpunkte (Intervall −11 bis +28, p = 0,099) und ist nicht belastbar. Gegenüber „ohne Werkzeuge“ sind es +15,5 Punkte (p = 0,0001).", "<b>Der Gewinn war zum Teil zugeschnitten.<\/b> An den sechs Entwicklungsfragen erreichte MCP v2 45 %, an den neuen Fragen 17 %. Die lokalen Werkzeuge liegen an beiden Sätzen gleich (8 % und 7 %), die neuen Fragen sind also nicht einfach schwerer. Der Vorsprung gegenüber lokalen Werkzeugen sank von +37 auf +11 Prozentpunkte.", "<b>Aufwand:<\/b> Aufrufe 1,6 gegen 2,8 (lokal), Zeit 14 s gegen 10 s (+4,7 s, p = 0,003), Eingabe-Tokens 6.900 gegen 3.100 (p = 0,0006). MCP v2 ist hier also langsamer und teurer als die einfachen Dateiwerkzeuge.", "<b>Wo MCP v2 scheitert:<\/b> Bei C5 (Copybook mit allen Feldern und den Programmen, die es einbinden) erreicht Qwen mit MCP v2 nur 2 %, mit den lokalen Werkzeugen 63 %. v2 liefert weder den Quelltext des Copybooks noch die Verwender. Bei den Fragen J1 (Passwortregel), C2 (Menü) und J3 (Benachrichtigung) holt Qwen mit MCP v2 keinen einzigen Punkt."], "reading": "Lesehilfe: Zeit und Tokens gelten nur innerhalb eines Modells. Je Variante 30 Antworten, die Rubrikwerte je Frage beruhen auf je drei Läufen."}, "k5": {"title": "Kapitel 5: Weiterentwicklung, der Server macht mehr Arbeit", "intro": ["<b>Diagnose aus Kapitel 4 und aus den Verläufen:<\/b> Qwen hört nach 1 bis 3 Werkzeugaufrufen auf und antwortet. Je mehr es nachschlägt, desto besser die Antwort. Das Modell kann den nötigen Weg (suchen, Entität holen, Paragraphen für Paragraphen lesen) nicht zuverlässig selbst gehen. Also sollte der Server die Arbeit machen.", "<b>Was <code>answer_context<\/code> tut:<\/b> Es nimmt die Frage als Text, erkennt darin Namen von Klassen, Methoden, Programmen, Paragraphen und Copybooks, löst sie im Index auf (auch <code>Klasse.methode<\/code> und Mehrwortanfragen) und liefert ein Beweispaket in einem Aufruf. Dazu gehören der Quelltext mit Zeilennummern (ohne Leer- und Kommentarzeilen), Aufrufer und Aufgerufene, Datenzugriffe, die Verwender des Symbols (zum Beispiel alle Programme, die ein Copybook einbinden), bei Methoden die wichtigste Hilfsmethode derselben Klasse, bei Aufrufer-Fragen die Aufrufstelle und bei großen Programmen die Paragraphen, die zur Frage passen (ausgewählt über eine deutsch-englische Wortzuordnung). Die Antwort ist hart auf etwa 8.000 Zeichen begrenzt, weil Qwen nur 8.192 Token Kontext hat. Zusätzlich habe ich die Werkzeugbeschreibungen von etwa 2.300 auf 1.900 Token gekürzt.", "<b>Vorgehen:<\/b> Entwickelt und gemessen wurde nur an den sechs ursprünglichen Fragen (Entwicklungssatz), der Testsatz aus Kapitel 4 blieb unberührt. Sechs Bedingungen mit je 30 Sitzungen (Tabelle). Die Regel für die Auswahl der Variante, die in den Test geht, wurde vorab festgelegt: die mit der höchsten Qualität."], "coverage_title": "Was das Beweispaket enthält, gemessen ohne Modell", "coverage_text": "Wendet man die Rubrik auf den Text des Beweispakets selbst an, erhält man die Obergrenze dessen, was ein Modell daraus entnehmen könnte. Im ersten Entwurf lag sie im Mittel bei 59 %, nach den Verbesserungen bei 74 %. Offen bleiben C3 (die Ablehnungscodes liegen in zwei Paragraphen, die nicht ausgewählt werden) und J2 (die Sperrregel liegt zwei Klassen weiter).", "coverage": [["C1 Anmeldung", 0.44, 1.0], ["C2 Zahlung", 0.73, 0.73], ["C3 Buchung", 0.5, 0.5], ["J1 Authentifizierung", 0.62, 0.69], ["J2 Sperre", 0.27, 0.55], ["J3 Benutzer anlegen", 1.0, 1.0]], "findings": ["<b>Der Denkmodus allein hilft nicht.<\/b> Mit allen Werkzeugen liegt die Qualität mit Denkmodus bei 36 %, ohne bei 38 %, die Zeit verdoppelt sich. Der Denkmodus beseitigt aber die ungültigen Werkzeugaufrufe (0 leere Antworten gegen 3).", "<b>Qwen wählt das neue Werkzeug kaum.<\/b> Mit allen Werkzeugen ruft es <code>answer_context<\/code> in 4 (ohne Denkmodus) bzw. 11 (mit Denkmodus) von 30 Sitzungen auf und greift stattdessen zu <code>search_code<\/code>. Wo es genutzt wird, liegt die Qualität bei 58 % bis 68 %, sonst bei 24 % bis 33 %. Das ist mit den Fragen vermischt, zeigt aber, dass die Werkzeugwahl der Engpass ist.", "<b>Eine schlanke Liste ohne Denkmodus scheitert.<\/b> Nur <code>answer_context<\/code>, <code>explain_symbol<\/code> und <code>get_code_entity<\/code>, ohne Denkmodus: 13 von 30 Antworten sind leer, 53 Wiederholungen waren nötig. Die Ursache steht im Kasten unten.", "<b>Beides zusammen funktioniert.<\/b> Schlanke Liste und Denkmodus (Z5): 26 von 30 Sitzungen nutzen <code>answer_context<\/code>, ein einziger Aufruf genügt, 1 leere Antwort. Die Qualität liegt mit 43 % auf dem Niveau der Referenz (45 %, Unterschied −1,8 Prozentpunkte, Intervall −16 bis +10, p = 0,70). Der Gewinn liegt woanders: Aufrufe 1,0 statt 3,0 und Tokens 4.700 statt 13.800 (−66 %). Der Preis sind 32 s statt 18 s Zeit.", "<b>Schwächen bleiben:<\/b> C1 (0,53 → 0,29) und J2 (0,27 → 0,15) sind schlechter als in der Referenz, C2 (0,40 → 0,55) und J1 (0,45 → 0,55) besser."], "failure_title": "Anatomie des Fehlers: ein ungültiger Werkzeugaufruf", "failure_text": "Bei Z4 blieb fast die Hälfte der Antworten leer. Die Ursache habe ich am rohen Text nachvollzogen: Qwen schreibt einen Werkzeugaufruf, der fast richtig ist, maskiert aber das einfache Anführungszeichen in <code>'Y'<\/code> als <code>\\'<\/code>. Das ist in JSON nicht erlaubt. Ollama kann den Aufruf nicht lesen, verwirft ihn ohne Fehlermeldung und liefert eine leere Nachricht. Der neue Parameter mit der ganzen Frage als freiem Text hat diese Fehlerquelle eingeführt, die früheren Werkzeuge nahmen nur Namen und Zahlen. Mit eingeschaltetem Denkmodus tritt der Fehler praktisch nicht auf. Im Test-Harness wiederholt der Client bei einer leeren Nachricht bis zu zweimal mit einem Hinweis, wie es ein Agent-Client auch täte.", "failure_raw": "<tool_call>\n{\"name\": \"answer_context\", \"arguments\": {\"project_id\": 1, \"question\": \"In AWS CardDemo: Was tut COBIL00C, wenn der Benutzer die Zahlung mit \\'Y\\' bestaetigt? ...\", \"max_chars\": 8000}}\n<\/tool_call>"}, "k6": {"title": "Kapitel 6: Test der neuen Schnittstelle an den neuen Fragen", "intro": ["<b>Vorgehen:<\/b> Die beste Entwicklungsvariante (Z5, schlanke Werkzeugliste mit Denkmodus) wurde einmal an den zehn neuen Fragen aus Kapitel 4 gemessen, ohne weitere Änderung, mit vorab festgelegten Erwartungen und gepaart gegen MCP v2 an denselben Fragen und Wiederholungen. Die Erwartungen: Qualität nicht schlechter als v2; weniger Aufrufe und Tokens; höhere Zeit."], "findings": ["<b>Qualität: 36 % statt 17 %<\/b> mit MCP v2 (+19 Prozentpunkte, Intervall +1,7 bis +41, p = 0,002). 14 von 30 Antworten sind brauchbar (mindestens 50 % der Punkte), mit v2 sind es 5, mit den lokalen Werkzeugen 2. Gegenüber den lokalen Werkzeugen +30 Prozentpunkte (p &lt; 0,0001).", "<b>Aufwand:<\/b> Die Eingabe-Tokens sinken von 6.900 auf 3.000 (−56 %, p &lt; 0,0001, belegt). Die Aufrufe sinken von 1,6 auf 1,0, das Intervall schneidet aber knapp die Null (−1,1 bis +0,03, p = 0,007), nach dem festgelegten Maßstab ist das nicht eindeutig belegt. Die Zeit steigt von 14 s auf 32 s (+18 s, p &lt; 0,0001), das ist der Denkmodus.", "<b>Was besser wurde:<\/b> C5 Copybook (0,02 → 1,00), J1 Passwortregel (0,00 → 0,55), C2 Menü (0,00 → 0,22), J4 Aufrufer (0,30 → 0,50). <b>Weiter schwach:<\/b> C1 Zinsberechnung (0,02), J2 JWT-Filter (0,00), J3 Benachrichtigung (0,03).", "<b>Einschränkung:<\/b> Ich kannte die zehn Fragen, als ich die Funktion für Verwender und Aufrufer entworfen habe. Der Sprung bei C5 (Copybook samt Verwendern) ist deshalb der am wenigsten unabhängige Teil. Die Qualität bleibt insgesamt niedrig: 36 % gegenüber 74 % bis 81 % bei Luna."]}}, "luna": {"k4": {"title": "Kapitel 4: Prüfung mit zehn neuen Fragen (MCP v2)", "intro": ["Dieselben zehn neuen Fragen, dieselbe Rubrik und dieselbe Auswertung wie bei Qwen (siehe dort für Begründung und Vorgehen). Je Variante 30 Antworten, 90 Sitzungen. Die neue Schnittstelle (v3) wurde bei Luna bewusst nicht gemessen."], "findings": ["<b>Qualität:<\/b> ohne Werkzeuge 0 %, lokale Shell 81 %, MCP v2 74 %. Der Unterschied von −7,3 Prozentpunkten ist nicht belastbar (Intervall −24 bis +6, p = 0,14). Dass MCP nicht schlechter ist, lässt sich mit der Grenze von −5 Prozentpunkten nicht belegen.", "<b>Beide Wege fallen gegenüber den Entwicklungsfragen ab<\/b> (Shell 94 % → 81 %, MCP v2 92 % → 74 %), der Abstand wächst von 3 auf 7 Prozentpunkte.", "<b>Der Mehraufwand hängt an der Fragenart.<\/b> Bei Fragen zu ganzen Programmen (C1, C3, C4) braucht MCP im Mittel 7,1 Aufrufe mehr als die Shell, bei Fragen zu einzelnen Methoden 0,8. Das bestätigt den Befund aus der ersten Messung: Luna fragt ein Programm Paragraph für Paragraph ab, wo die Shell es am Stück liest.", "<b>Schwachstellen von MCP v2:<\/b> J4 (Aufrufer von <code>createTasks<\/code>) 0,37 gegen 1,00 mit der Shell, weil der Index nur 6 von 13 Aufruferklassen kennt, und C4 (Bericht) 0,56 gegen 1,00. <b>Vorne liegt MCP<\/b> bei J2 (0,86 gegen 0,71), C3 (0,92 gegen 0,83) und J5 (0,81 gegen 0,74).", "<b>Ohne Werkzeuge bekommt Luna nichts<\/b> (0 %), die Rubrik lässt sich also nicht erraten. Luna antwortet dann, dass sie ohne Code nichts belegen kann."]}}, "compare": {"title": "An den neuen Fragen", "lead": "Qualität und brauchbare Antworten an den zehn neuen Fragen, soweit gemessen. Für Luna gibt es nur MCP v2.", "findings": ["<b>Auch an neuen Fragen bleibt der Abstand zwischen den Modellen groß:<\/b> Qwen mit der neuen Schnittstelle 36 %, Luna mit MCP v2 74 %.", "<b>Die neue Schnittstelle hilft dem kleinen Modell deutlich<\/b> (17 % → 36 %), bei Luna ist sie nicht gemessen. Ob sie dort etwas ändert oder schadet, ist offen.", "<b>Qwens Gewinn kostet Zeit:<\/b> 32 s statt 14 s. Luna braucht mit MCP v2 32 s."]}, "next": ["<b>Den Parameter verschlanken:<\/b> Statt der ganzen Frage nur die Namen der Symbole und ein kurzes Thema entgegennehmen. Das beseitigt die ungültigen Werkzeugaufrufe an der Wurzel und könnte den Denkmodus (und damit 18 s) überflüssig machen. Dafür müsste neu gemessen werden.", "<b>Eine schlanke Werkzeugliste für kleine Modelle anbieten:<\/b> Qwen wählt <code>answer_context<\/code> nur, wenn es die einzige Alternative zur Suche ist. Der Server könnte ein Profil „klein“ mit nur drei Werkzeugen ausliefern.", "<b>Die drei schwachen Fragen untersuchen:<\/b> C1, J2 und J3 liefern auch mit dem Beweispaket kaum Punkte. Dort liegt die Information tiefer oder in Konstanten, die der Index nicht kennt (Weiterleitungsziele, Meldungstexte).", "<b>Den Index verbessern:<\/b> J4 zeigt, dass nur 6 von 13 Aufruferklassen aufgelöst sind. Fehlende Auflösung kostet bei Luna Punkte.", "<b>Eine unabhängige Endprüfung:<\/b> Zehn frische Fragen, die vor der Messung weder dem Entwickler noch der Rubrik bekannt sind, und ein Test der neuen Schnittstelle auch mit Luna."], "method_add": ["<b>Kapitel 4 (Prüfung):<\/b> Zehn neue Fragen (fünf COBOL, fünf Java) mit Prüfsumme, Rubrik und Hypothesen vor dem ersten Lauf festgelegt. Die Rubriken wurden nur gegen die eigene Sollantwort und das Wiederholen der Frage geprüft. 10 Fragen × 3 Varianten × 3 Wiederholungen je Modell.", "<b>Kapitel 5 (Entwicklung):<\/b> Entwickelt und gemessen nur an den sechs ursprünglichen Fragen, je Bedingung 5 Wiederholungen. Der Entwicklungsserver lief auf einer zweiten Instanz mit gleicher Datenbank, der produktive Server blieb auf v2. Die Auswahlregel (höchste Qualität) wurde vorab festgelegt.", "<b>Kapitel 6 (Test):<\/b> Die ausgewählte Variante wurde einmal an den zehn neuen Fragen gemessen (30 Sitzungen), mit vorab festgelegten Erwartungen, gepaart gegen MCP v2 an denselben Fragen.", "<b>Harnessänderung:<\/b> Nach den ersten 22 Sitzungen von Z1 wurde ein Wiederholungsversuch ergänzt (bis zu zwei Mal mit einem Hinweis), wenn Ollama einen Werkzeugaufruf mit ungültigem JSON verwirft. Die Läufe ohne Wiederholungsversuch sind getrennt abgelegt. In früheren Kapiteln gab es keine leeren Antworten, die Änderung betrifft sie nicht."], "limits_add": ["<b>Der Testsatz ist nicht völlig unberührt:<\/b> Ich kannte die zehn neuen Fragen, als ich <code>answer_context<\/code> entworfen habe, und habe jede Fähigkeit mit einer der Entwicklungsfragen begründet. Der Sprung bei C5 gilt am wenigsten als unabhängig.", "<b>Qwen wurde mit einer verschlankten Werkzeugliste und im Denkmodus getestet.<\/b> Das ist eine Clientwahl und nicht die Standardeinstellung eines Agenten. Mit allen Werkzeugen wählt Qwen das neue Werkzeug kaum.", "<b>Die neue Schnittstelle wurde mit Luna nicht gemessen<\/b> und ist nicht deployed. Produktiv läuft MCP v2."]}, "ch78": {"title": "MCP im Benchmark: Qwen und Luna, vier Fassungen der Schnittstelle", "lead": "Qwen3-8B (lokal) und GPT-6-Luna (Codex CLI) beantworten Fragen zu COBOL- und Java-Code, ohne Werkzeuge, mit lokalen Dateiwerkzeugen und mit der Doctus-MCP-Schnittstelle. Gemessen wurden v1, die Überarbeitung v2 und für Qwen zwei weitere Fassungen, bei denen der Server die Arbeit übernimmt (v3, v4/v4.1). Alles zuerst an sechs Entwicklungsfragen, dann an zehn neuen Fragen. Unten stehen die Ergebnisse je Modell in acht Kapiteln, am Ende der Vergleich.", "top": ["<b>Qwen:<\/b> Wenn der Server den Evidenz-Pack selbst als ersten Schritt ausführt (v4/v4.1), antwortet Qwen in 23 s statt 32 s und mit 3.500 statt 4.600 Tokens je Antwort (beides belegt gegenüber v3). Die Qualität liegt an den neuen Fragen bei 37 % bis 40 % gegenüber 36 % bei v3, das ist <b>kein belegter Unterschied<\/b>. Gegenüber v2 (17 %) ist der Gewinn belegt.", "<b>Luna:<\/b> Mit Werkzeugen bleibt sie weit vorn (74 % bis 81 %), MCP v2 liegt aber auch an neuen Fragen hinter der lokalen Shell. Die neuen Fassungen wurden bei Luna nicht gemessen.", "<b>Wichtigste Lehre:<\/b> Verbesserungen, die ich an einer Frage diagnostiziert habe, wirken an dieser Frage (C1: 2 % → 62 %), verschlechtern aber andere (C4: 21 % → 0 %). Ein belegter Qualitätsgewinn braucht neue, unberührte Fragen."], "next": ["<b>Unabhängige Endprüfung:<\/b> Zehn frische Fragen zu anderen Programmen, Rubrik und Festlegung vor dem Lauf, ein Durchgang mit v4.1. Erst das sagt, ob die Auswahllogik allgemein trägt.", "<b>Mehr Kontext für das Beweispaket:<\/b> Das Paket muss in 8.192 Token Kontext passen (rund 5.500 Zeichen). Mit 16.000 Token wären bessere Antworten wahrscheinlich, das hängt an Arbeitsspeicher und Ollama-Einstellungen (Entscheidung offen).", "<b>Paketgröße auch bei Java einhalten:<\/b> Bei den Entwicklungsfragen wurde das Paket in 9 von 18 Läufen von der Obergrenze des Harness (6.000 Zeichen) abgeschnitten, vor allem bei Java-Methoden mit vielen Aufrufern.", "<b>Den Index verbessern:<\/b> J4 zeigt, dass nur 6 von 13 Aufruferklassen aufgelöst sind. Fehlende Auflösung kostet Punkte.", "<b>Luna mit v4.1 messen<\/b> und die Fassung produktiv bereitstellen, sobald die Endprüfung vorliegt."], "k7": {"title": "Kapitel 7: Der Server führt den Evidenz-Pack selbst aus (v4)", "intro": ["<b>Idee:<\/b> In Kapitel 5 und 6 musste Qwen das neue Werkzeug <code>answer_context<\/code> erst wählen. Jetzt führt der Server es als ersten Schritt selbst aus (wie es der Chat in Doctus künftig tut) und legt das Ergebnis in die Unterhaltung. Qwen schreibt danach direkt die Antwort, weitere Werkzeuge bleiben erlaubt (nur <code>answer_context<\/code>, <code>explain_symbol<\/code>, <code>get_code_entity<\/code>, Denkmodus).", "<b>Was v4 gegenüber v3 ändert:<\/b> (1) Fakten je Absatz oder Methode: Meldungstexte und zugewiesene Codes, zum Beispiel <code>sets WS-VALIDATION-FAIL-REASON=100<\/code>; (2) Auswahl der Absätze und Hilfsmethoden zusätzlich per bge-m3-Embedding; (3) die Aufrufkette wird bis Tiefe 2 verfolgt; (4) Parameter <code>symbols<\/code> und <code>topic<\/code> statt der ganzen Frage. Die Fakten berechnet der Server beim Abruf aus dem indexierten Quelltext, nicht im Parser. Ein neuer Import ist dafür nicht nötig.", "<b>Messung:<\/b> Zehn Hold-out-Fragen × 3 Wiederholungen, nur MCP-Arm, gepaart gegen v3 (Kapitel 6) und v2 (Kapitel 4). Erwartungen vorab in <code>manifest_ch7.json<\/code> festgelegt: Qualität höher als v3, weniger Aufrufe, Zeit nicht über v3 + 5 s."], "findings": ["<b>Qualität unverändert:<\/b> 36,8 % gegenüber 36,2 % bei v3 (+0,6 Prozentpunkte, Intervall −11 bis +9, p = 0,92). Die Erwartung H1 ist <b>nicht bestätigt<\/b>.", "<b>Zeit und Tokens belegt niedriger:<\/b> 24,5 s statt 32,4 s (−7,8 s, p &lt; 0,0001), Tokens gesamt 3.400 statt 4.600 (−1.170, p &lt; 0,0001). Die Zeit (H3) liegt unter v3, die Erwartung war „höchstens +5 s“, sie ist erfüllt.", "<b>Jede Sitzung hat genau einen Werkzeugaufruf<\/b> (den festen Prefetch). Qwen ruft danach nichts mehr auf und antwortet in einem Zug. Das Paket ist im Mittel 6.100 Zeichen groß und braucht 0,8 s.", "<b>Fehleranalyse:<\/b> In 21 von 30 Läufen hat die Obergrenze des Harness von 6.000 Zeichen das Paket am Ende abgeschnitten. Dazu kamen drei inhaltliche Fehler: Bei C1 wählte die Absatzauswahl die falschen Absätze (<code>1200-GET-INTEREST-RATE<\/code> statt <code>1300-COMPUTE-INTEREST<\/code>), <code>JWTAuthenticationFilter<\/code> wurde nicht als Symbol erkannt (Abkürzung am Wortanfang), und unwichtige Statusvariablen (<code>APPL-RESULT=12<\/code>) verdrängten die Fakten. Daraus entstand v4.1 (Kapitel 8)."]}, "k8": {"title": "Kapitel 8: Nachbesserung nach der Fehleranalyse (v4.1)", "intro": ["<b>Änderungen gegenüber v4:<\/b> (1) Namen mit Abkürzungspräfix werden als Symbol erkannt. (2) Die Absatzauswahl deckt die Fragewörter ab: bereits abgedeckte Wörter zählen nicht erneut, Allerweltswörter („Programm“, „Datei“) und die Labels der Fakten zählen nicht. (3) Ein PERFORM-Schritt weiter wird mitgeliefert. (4) Fakten nennen berechnete Felder (<code>computes WS-MONTHLY-INT<\/code>), Statusvariablen ohne Aussage entfallen. (5) Das Paket hält die Größe ein: Quelltexte werden gekürzt, statt ganze Absätze zu verwerfen.", "<b>Wichtiger Hinweis zur Methodik:<\/b> Diese Änderungen entstanden, nachdem ich die Rubrikpunkte von Kapitel 7 auf denselben zehn Fragen gesehen hatte. Kapitel 8 ist deshalb ein <b>Entwicklungsdurchlauf<\/b>, kein unabhängiger Test. Auch die Wörterbucheinträge <code>formel<\/code> und <code>buchung<\/code> und die Stoppwörter stammen aus der Diagnose von C1. Festlegung: <code>manifest_ch8.json<\/code>.", "<b>Messung:<\/b> Zehn Hold-out-Fragen × 3 und sechs Entwicklungsfragen × 3 Wiederholungen, nur MCP-Arm."], "findings": ["<b>Hold-out:<\/b> Qualität 39,9 % (v3 36,2 %, v4 36,8 %). Gegenüber v3 +3,6 Prozentpunkte, Intervall −8,8 bis +18,7, p = 0,44: <b>nicht belegt<\/b>. Zeit 23,3 s (−9,0 s gegenüber v3, belegt), Tokens gesamt 3.470 (−1.110, belegt). Gegenüber v2 ist der Qualitätsgewinn belegt (+22,7 Prozentpunkte, p = 0,0006).", "<b>Entwicklungsfragen:<\/b> Qualität 56,2 % (v3 43,4 %, v2 45,2 %). Gegenüber v3 +6,7 Prozentpunkte, Intervall −5,3 bis +21,2, p = 0,16: nicht belegt. Brauchbare Antworten 13 von 18 (72 %) gegenüber 13 von 30 (43 %) bei v3; Zeit −7,1 s und Tokens −1.230 (belegt). Diese Fragen kenne ich seit der Entwicklung, der Wert ist geschönt.", "<b>Eine Frage stark verbessert:<\/b> C1 Zinsberechnung stieg von 2 % auf 62 %, J2 JWT-Filter von 0 % auf 12 %. Das waren genau die Fälle, die ich repariert habe.", "<b>Andere Fragen wurden schlechter:<\/b> C4 Bericht 21 % → 0 %, C3 Benutzer anlegen 64 % → 39 % (gegenüber v4), C2 Menü 28 % → 11 %. Mit rund 5.500 Zeichen Paketgröße (8.192 Token Kontext) bleibt wenig Platz: Wo die Auswahl andere Absätze wählt, fehlen die Belege der bisher getroffenen.", "<b>Paketgröße:<\/b> Im Hold-out wurde das Paket nur noch in 3 von 30 Läufen abgeschnitten (v4: 21), bei den Entwicklungsfragen noch in 9 von 18 (mittlere Größe 7.700 Zeichen, vor allem Java-Methoden mit vielen Aufrufern)."], "hyp": [["<b>H1<\/b> Qualität höher als v3 (gepaart, Bonferroni α = 0,0125; nicht unterlegen −5 PP)", "nicht belegt", "v4: +0,6 PP (Intervall −11 bis +9, p = 0,92); v4.1: +3,6 PP (−8,8 bis +18,7, p = 0,44). Nichtunterlegenheit erfüllt, Überlegenheit nicht gezeigt."], ["<b>H2<\/b> Weniger Werkzeugaufrufe als v3", "bestätigt (trivial)", "1,0 statt 1,03: der feste Prefetch ist der einzige Aufruf. Der Unterschied ist klein."], ["<b>H3<\/b> Wandzeit nicht höher als v3 + 5 s", "bestätigt", "v4: −7,8 s, v4.1: −9,0 s gegenüber v3 (p &lt; 0,0001)."]]}, "method_add": ["<b>Kapitel 7 (v4):<\/b> Zehn Hold-out-Fragen × 3 Wiederholungen, nur MCP-Arm, mit Prefetch (Frage unverändert an <code>answer_context<\/code>, 5.000 Zeichen), lean Werkzeugliste und Denkmodus. Festlegung vorab in <code>manifest_ch7.json<\/code>, gepaart gegen v3 und v2.", "<b>Kapitel 8 (v4.1):<\/b> Gleiche Konfiguration mit nachgebessertem Server. Festlegung <code>manifest_ch8.json<\/code>, mit dem Hinweis, dass die Änderungen nach Kenntnis der Ergebnisse auf denselben Fragen entstanden. Zusätzlich sechs Entwicklungsfragen × 3 Wiederholungen."], "limits_add": ["<b>Kapitel 8 ist kein unabhängiger Test:<\/b> Die Nachbesserungen folgen aus der Fehleranalyse derselben Fragen. Dass C1 steigt, ist erwartbar. Ob die Auswahllogik allgemein trägt, zeigt nur ein Test mit neuen Fragen.", "<b>Wörterbuch und Stoppwörter<\/b> (<code>formel<\/code>, <code>buchung<\/code>, „Programm“ …) sind deutsch und COBOL-nah. Für andere Sprachen und Fachgebiete wären sie anzupassen.", "<b>Der Prefetch ist in der Messung ein Harness-Schritt:<\/b> Er ruft denselben Code wie der Chat auf, aber über MCP. Der Chat in Doctus selbst wurde mit einem Modell noch nicht Ende-zu-Ende gemessen.", "<b>Nur Qwen:<\/b> Luna wurde mit v4 und v4.1 nicht gemessen. v4.1 ist committet und auf <code>origin/develop<\/code>, produktiv deployed ist es nicht (dort läuft MCP v2)."]}}, "lateData": {"hold_tasks": [{"id": "H-C1-INTEREST", "category": "Batch-Berechnung", "project": "carddemo", "prompt": "In AWS CardDemo: Wie berechnet das Batch-Programm CBACT04C die Zinsen? Nenne die Formel, die gelesenen Dateien, welche Buchung geschrieben wird und wie das Konto am Ende angepasst wird.", "weight": 15}, {"id": "H-C2-MENU", "category": "Menüsteuerung", "project": "carddemo", "prompt": "In AWS CardDemo: Wie verarbeitet COMEN01C die Eingabe einer Menüoption? Wie viele Optionen gibt es, welche Prüfungen laufen, was passiert bei Admin-Optionen für normale Benutzer und wie wird das Zielprogramm gestartet?", "weight": 12}, {"id": "H-C3-USERADD", "category": "Eingabeprüfung", "project": "carddemo", "prompt": "In AWS CardDemo: Wie legt COUSR01C einen neuen Benutzer an? Welche Eingaben werden geprüft (mit den Meldungen), wohin wird geschrieben und was passiert bei doppelter Benutzer-ID und bei den Funktionstasten?", "weight": 12}, {"id": "H-C4-REPORT", "category": "Berichtserzeugung", "project": "carddemo", "prompt": "In AWS CardDemo: Wie erzeugt CBTRN03C den Transaktionsbericht? Welche Dateien werden gelesen und geschrieben, wie wird der Zeitraum gefiltert und wann werden Seiten-, Konten- und Gesamtsummen geschrieben?", "weight": 13}, {"id": "H-C5-COPYBOOK", "category": "Datensatz und Auswirkung", "project": "carddemo", "prompt": "In AWS CardDemo: Wie ist der Transaktionssatz TRAN-RECORD aufgebaut (Copybook CVTRA05Y, nenne Felder mit Länge) und welche Programme binden dieses Copybook ein?", "weight": 17}, {"id": "H-J1-PASSWORDRULE", "category": "Richtlinienprüfung", "project": "syncope", "prompt": "In Apache Syncope: Wie prüft DefaultPasswordRule.enforce ein neues Passwort für einen Benutzer? Welche Werte dürfen nicht im Passwort vorkommen, welche Regeln werden zusammengestellt und welche + authenticationEntryPoint.commence(BadCredentialsException).", "variants": {"local": {"rubric": 0.5714, "hit": ["verify", "expiration", "expired-message", "not-before", "security-context", "entry-point"], "miss": ["provider-by-issuer", "authenticate-as-admin", "error-handling"], "answer": "`JWTAuthenticationFilter.doFilterInternal()` verarbeitet den `Authorization`-Header. Fehlt er, hat er nicht genau zwei durch Leerzeichen getrennte Teile oder beginnt er nicht mit `Bearer`, reicht der Filter die Anfrage unverändert mit `chain.doFilter()` weiter; er setzt dann selbst keine Authentifizierung (JWTAuthenticationFilter.java:80–85).\n\nBei einem passenden `Bearer <Token>`-Header prüft der Filter der Reihe nach:\n\n1. `credentialChecker.checkIsDefaultJWSKeyInUse()` wird aufgerufen; erst danach wird das Token mit `SignedJWT.parse()` geparst (JWTAuthenticationFilter.java:90–95).\n2. Für die Signatur holt er anhand des JWT-Issuers (`jwt.getJWTClaimsSet().getIssuer()`) den passenden `JWTSSOProvider` aus `dataAccessor` und prüft `jwt.verify(jwtSSOProvider)`. Bei ungültiger Signatur löst er `BadCredentialsException` aus (JWTAuthenticationFilter.java:96–100).\n3. Er liest die Claims und nimmt `System.currentTimeMillis()` als Referenzzeit. Ist `expirationTime` vorhanden und liegt vor dieser Zeit, ruft er `dataAccessor.removeExpired(claims.getJWTID())` auf und löst `CredentialsExpiredException` aus (JWTAuthenticationFilter.java:102–110).\n4. Ist `notBefore` vorhanden und liegt nach der Referenzzeit, löst er ebenfalls `CredentialsExpiredException` aus (JWTAuthenticationFilter.java:112–116).\n\nSind diese Prüfungen erfolgreich, erzeugt der Filter ein `JWTAuthentication`-Objekt aus den Claims und den mit `authenticationDetailsSource.buildDetails(request)` ermittelten Request-Details. Er ", "tools": ["shell({\"command\": \"/bin/bash -lc 'rg -n \\\"class JWTAuthenticationFilter|JWTAuthenticat)", "shell({\"command\": \"/bin/bash -lc \\\"nl -ba core/spring/src/main/java/org/apache/syncope)"], "wall_s": 28.98, "status": "ok", "retries": 0}, "mcp": {"rubric": 0.8571, "hit": ["provider-by-issuer", "verify", "expiration", "expired-message", "not-before", "authenticate-as-admin", "security-context", "entry-point"], "miss": ["error-handling"], "answer": "`JWTAuthenticationFilter#doFilterInternal` prüft das Token in dieser Reihenfolge (`core/spring/src/main/java/org/apache/syncope/core/spring/security/JWTAuthenticationFilter.java`):\n\n1. **Authorization-Header:** Es liest `Authorization` und zerlegt den Wert an Leerzeichen. Fehlt der Header, bestehen die Teile nicht genau aus zwei Elementen oder beginnt der Wert nicht mit `Bearer`, leitet der Filter die Anfrage mit `chain.doFilter` weiter und kehrt zurück. (Zeilen 80–85)\n2. **Konfiguration und Parsing:** Vor dem Parsen ruft der Filter `credentialChecker.checkIsDefaultJWSKeyInUse()` auf. Dann parst er das Token mit `SignedJWT.parse`. (Zeilen 90–95)\n3. **Signatur:** Anhand des Issuers aus `jwt.getJWTClaimsSet()` ermittelt `dataAccessor.getJWTSSOProvider(...)` den Prüfer. Liefert `jwt.verify(jwtSSOProvider)` `false`, entsteht `BadCredentialsException(\"Invalid signature found in JWT\")`. (Zeilen 96–100)\n4. **Ablaufzeit:** Der Filter liest die Claims und vergleicht `expirationTime` mit der aktuellen Systemzeit. Liegt eine vorhandene Ablaufzeit in der Vergangenheit, ruft er `dataAccessor.removeExpired(claims.getJWTID())` auf und wirft `CredentialsExpiredException(\"JWT is expired\")`. (Zeilen 102–110)\n5. **Gültig-ab-Zeit:** Liegt `notBefore` in der Zukunft, wirft er `CredentialsExpiredException(\"JWT not valid yet\")`. (Zeilen 112–116)\n\nBei Erfolg erzeugt der Filter `JWTAuthentication` aus den Claims und den Request-Details, setzt `authenticated` auf `true` und authentifiziert innerhalb v", "tools": ["explain_symbol({\"project_id\": 2, \"symbol\": \"JWTAuthenticationFilter\", \"max_chars\": 12000})"], "wall_s": 17.83, "status": "ok", "retries": 0}}}]}, "hyp": {"H1": {"text": "Qwen: MCP v2 liefert besse r": "Nach erfolgreicher Anmeldung in COSGN00C wird als naechstes das Programm SEND-SIGNON-SCREEN gestartet. Die Auswahl hängt von der Evaluierung der Eingabe ab, die in der Zeile 83-87 und 90-94 des Programms COSGN00C (Datei: app/cbl/COSGN00C.cbl) erfolgt. Die Pruefung der Zugangsdaten wird in der Datei app/cbl/COSGN00C.cbl durchgefuehrt, insbesondere in den Abschnitten, die mit der Verarbeitung der Eingabe und der Pruefung der Anmeldeinformationen verbunden sind.", "tools": ["research_project({\"limit\": 10, \"project_id\": 1, \"query\": \"COSGN00C\", \"hops\": 1})"], "wall_s": 5.13, "status": "ok", "retries": 0}, "Z5": {"rubric": 0.2222, "hit": ["usrsec-file"], "miss": ["admin-target", "user-target", "selector", "password-compare", "xctl"], "answer": "Nach erfolgreicher Anmeldung in **COSGN00C** wird das Programm **CARDDEMO** als naechstes gestartet. Die Auswahl hängt von der im **WS-TRANID** gespeicherten Transaktions-ID ab, die im Hauptprogramm (z. B. **CARDDEMO**) definiert wird. Die Prüfung der Zugangsdaten erfolgt über die Datei **WS-USRSEC-FILE**, die im Abschnitt `READ-USER-SEC-FILE` (Zeile 211–227) gelesen wird. \n\n**Beweise:**  \n- **COSGN00C.cbl:140** (`READ-USER-SEC-FILE`): Lesen der Sicherheitsdatei `WS-USRSEC-FILE`.  \n- **COSGN00C.cbl:100–102**: `TRANSID (WS-TRANID)` bestimmt die Weiterleitung zur nächsten Transaktion (z. B. `CARDDEMO`).  \n- **COSGN00C.cbl:80–85**: Die Transaktions-ID wird im Hauptprogramm (z. B. `CARDDEMO`) gesetzt.  \n\nDie Datei `WS-USRSEC-FILE` wird im `READ-USER-SEC-FILE`-Abschnitt (Zeile 211–227) gelesen, um die Zugangsdaten zu prüfen.", "tools": ["answer_context({\"project_id\": 1, \"question\": \"In AWS CardDemo: Welches Programm wird nach erfol)"], "wall_s": 24.62, "status": "ok", "retries": 0}}}, {"task": "C2-BILLPAY", "category": "Datenzugriff", "prompt": "In AWS CardDemo: Was tut COBIL00C, wenn der Benutzer die Zahlung mit 'Y' bestaetigt? Welche Dateien/Datasets werden gelesen, geschrieben oder geaendert, wie wird die neue Transaktions-ID gebildet und wie aendert sich der Kontostand?", "truth": "app/cbl/COBIL00C.cbl PROCESS-ENTER-KEY (Z.154-247): READ ACCTDAT, READ CXACAIX (Kartennummer), STARTBR/READPREV/ENDBR TRANSACT mit HIGH-VALUES -> letzte ID +1, WRITE TRANSACT (Typ '02', Kat 2, 'BILL PAYMENT - ONLINE', TRAN-AMT = ACCT-CURR-BAL), COMPUTE ACCT-CURR-BAL = ACCT-CURR-BAL - TRAN-AMT, REWRITE ACCTDAT; Abbruch 'You have nothing to pay' wenn Saldo <= 0.", "variants": {"Z0": {"rubric": 0.1818, "hit": ["transact-write"], "miss": ["acctdat-update", "cxacaix-read", "txn-id", "balance", "txn-attrs", "nothing-to-pay"], "answer": "Wenn der Benutzer die Zahlung mit 'Y' bestätigt, führt das Programm **COBIL00C** folgende Aktionen aus:\n\n### 1. **Transaktions-ID-Generierung**\n- Die neue Transaktions-ID wird aus dem **TRAN-ID**-Feld gebildet, das in der **TRAN-RECORD**-Struktur gespeichert ist. Dieses Feld wird im Abschnitt **WRITE-TRANSACT-FILE** (Datei:Zeile `510-547`) verwendet, um die Transaktion in das **WS-TRANSACT-FILE**-Dataset zu schreiben.\n- Die Transaktions-ID wird im **WS-MESSAGE**-Feld formatiert und an den Benutzer angezeigt, wie in Zeile `529` und `530` des Quellcodes", "tools": ["search_code({\"project_id\": 1, \"query\": \"COBIL00C\", \"include_source\": true})", "explain_symbol({\"project_id\": 1, \"symbol\": \"COBIL00C\", \"max_chars\": 1500})", "explain_symbol({\"max_chars\": 1500, \"project_id\": 1, \"symbol\": \"COBIL00C.READ-ACCTDAT-FILE\"})", "explain_symbol({\"symbol\": \"COBIL00C.UPDATE-ACCTDAT-FILE\", \"max_chars\": 1500, \"project_id\": 1})", "explain_symbol({\"max_chars\": 1500, \"project_id\": 1, \"symbol\": \"COBIL00C.WRITE-TRANSACT-FILE\"})"], "wall_s": 12.99, "status": "ok", "retries": 0}, "Z1": {"rubric": 0.8182, "hit": ["transact-write", "acctdat-update", "cxacaix-read", "txn-id", "balance"], "miss": ["txn-attrs", "nothing-to-pay"], "answer": "Wenn der Benutzer die Zahlung mit 'Y' bestätigt, führt das Programm **COBIL00C** folgende Aktionen aus:\n\n1. **Lesevorgänge**:\n   - Es wird die Datei **ACCTDAT-FILE** gelesen, um die Kontodaten (z. B. Kontostand) zu laden.\n   - Die Datei **CXACAIX-FILE** wird gelesen, um die Transaktionsdaten zu prüfen und zu verarbeiten.\n\n2. **Schreibvorgänge**:\n   - Nach der Bestätigung wird die Transaktions-ID gebildet und die neue Transaktion wird in die Datei **TRANSACT-FILE** geschrieben. Dies geschieht durch den Aufruf der Prozedur **WRITE-TRANSACT-FILE**.\n\n3. **Bildung der Transaktions-ID**:\n   - Die neue Transaktions-ID wird durch den Aufruf der Prozedur **STARTBR-TRANSACT-FILE** und **READPREV-TRANSACT-FILE** generiert. Dabei wird die letzte Transaktions-ID aus der Datei **TRANSACT-FILE** gelesen und um 1 erhöht, um eine eindeutige neue Transaktions-ID zu bilden.\n\n4. **Kontostand**:\n   - Der Kontostand wird vor der Transaktion gelesen und bei erfolgreicher Bestätigung um den Betrag der Transaktion reduziert. Die Änderung wird in der Datei **ACCTDAT-FILE** gespeichert.\n\nDie genannten Dateien und Prozeduren sind in den Quellen **app/cbl/COBIL00C.cbl** (Zeilen 154–244, 510–547) und **app/cbl/COBIL00C.cbl** (Zeilen 210–214) dokumentiert.", "tools": ["answer_context({\"max_chars\": 14000, \"project_id\": 1, \"question\": \"In AWS CardDemo: Was tut COBI)"], "wall_s": 14.44, "status": "ok", "retries": 1}, "Z5": {"rubric": 0.5455, "hit": ["transact-write", "acctdat-update", "balance"], "miss": ["cxacaix-read", "txn-id", "txn-attrs", "nothing-to-pay"], "answer": "Wenn der Benutzer die Zahlung mit **'Y'** bestätigt, führt das Programm **COBIL00C** folgende Aktionen aus (basierend auf den Quellcodedetails):\n\n### 1. **Transaktionsabwicklung**\n- **Dateien/Datasets**:\n  - **READ-ACCTDAT-FILE**: Liest die Kontodaten (z. B. `ACCT-CURR-BAL`) aus dem `ACCTDAT`-Dataset (Datei: `app/cbl/COBIL00C.cbl:177`).\n  - **STARTBR-TRANSACT-FILE**: Startet eine Suchoperation im `TRANSACT`-Dataset (Datei: `app/cbl/COBIL00C.cbl:177`), um die Transaktions-ID (`TRAN-ID`) zu generieren.\n  - **WRITE-TR einer fehlgeschlagenen Anmeldung? Wann genau wird ein Benutzer wegen zu vieler Fehlversuche gesperrt und woher stammt das Limit?", "truth": "core/spring/.../UsernamePasswordAuthenticationProvider.java (Z.95-110): bei !isSuccess -> provisioningManager.suspendOnAuthFailures; bei Erfolg authenticationThrottler.clearFailures. core/workflow-java/.../AbstractUserWorkflowAdapter.java (Z.213-214): suspend wenn failedLogins > policy.getMaxAuthenticationAttempts() und max > 0 und nicht bereits suspendiert; Limit aus der AccountPolicy.", "variants": {"v2": {"rubric": 0.2727, "hit": ["caller", "strict-greater"], "miss": ["suspend-call", "workflow", "max-attempts", "account-policy", "throttler"], "answer": "Die Methode `AuthDataAccessor.authenticate(Optional<Domain>, Authentication)` wird von der Klasse `UsernamePasswordAuthenticationProvider` aufgerufen, spezifisch in der Zeile 97 der Datei `UsernamePasswordAuthenticationProvider.java`. Diese Methode wird verwendet, um Benutzeranmeldungen mit Benutzername und Passwort zu verarbeiten.\n\nBei einer fehlgeschlagenen Anmeldung wird die Methode `authenticateUser` aufgerufen, die in Zeile 404 der Datei `AuthDataAccessor.java` definiert ist. In dieser Methode wird geprüft, ob der Benutzername und das Passwort korrekt sind. Falls die Anmeldung fehlschlägt, wird der Benutzer nicht automatisch gesperrt, es sei denn, es wurden zu viele Fehlversuche registriert.\n\nDas Limit für die Anzahl der Fehlversuche und die Sperrung eines Benutzers wird in der Konfigurationsdatei `StandardConfParams.AUTHENTICATION_ATTEMPTS_LIMIT` definiert. Dieses Limit wird in der Methode `authenticateUser` überprüft, um zu bestimmen, ob der Benutzer aufgrund von zu vielen Fehlversuchen gesperrt werden soll. Die genaue Implementierung der Sperrung und des Limits ist in der Konfigurationslogik der Anwendung enthalten, die auf die Werte aus der Konfigurationsdatei zurückgreift.", "tools": ["search_code({\"project_id\": 2, \"query\": \"AuthDataAccessor.authenticate\", ird eine `UsernameNotFoundException` geworfen. Bei erfolgreicher Identifikation wird die Methode `authenticateUser` aufgerufen (Zeile 562), wo der Passwortcheck erfolgt. \n\nDie Sperrung nach zu vielen Fehlversuchen wird in der gezeigten Code-Extraktion **nicht direkt behandelt**. Das Limit für Fehlversuche stammt vermutlich aus einer Konfigurationsparameter-Definition (z. B. `StandardConfParams.MAX_FAILED_ATTEMPTS`), die über `confParamOps` abgerufen wird. Die konkrete Logik zur Sperrung wird in anderen Komponenten wie `UserLockoutService` oder ähnlichen Klassen implementiert, die im aktuellen Code-Extrakt nicht detailliert gezeigt werden. \n\n**Belege**:  \n- Aufruf von `AuthDataAccessor.authenticate`: `UsernamePasswordAuthenticationProvider.java:97`  \n- Konfigurationsparameter: `StandardConfParams.AUTHENTICATION_ATTRIBUTES` (Zeile 536–538).", "tools": ["answer_context({\"project_id\": 2, \"question\": \"In Apache Syncope: Welche Klasse ruft AuthDataAcc)"], "wall_s": 18.47, "status": "ok", "retries": 0}}}], "eff": {"v41_v3": [{"key": "rubric", "diff": 0.06658333333333333, "lo": -0.05321666666666668, "hi": 0.21190555555555554, "p": 0.158203125, "n": 18, "base": 0.4953166666666667, "other": 0.5619}, {"key": "usable", "diff": 0.16666666666666666, "lo": 0.0, "hi": 0.4444444444444444, "p": 0.25, "n": 18, "base": 0.5555555555555556, "other": 0.7222222222222222}, {"key": "tool_calls", "diff": 0.0, "lo": 0.0, "hi": 0.0, "p": 1.0, "n": 18, "base": 1.0, "other": 1.0}, {"key": "wall_s", "diff": -7.057777777777778, "lo": -9.91888888888889, "hi": -3.97888888888889, "p": 4.57763671875e-05, "n": 18, "base": 31.032222222222224, "other": 23.974444444444444}, {"key": "tokens_prompt", "diff": -758.6111111111111, "lo": -862.5, "hi": -684.3888888888889, "p": 7.62939453125e-06, "n": 18, "base": 3329.777777777778, "other": 2571.1666666666665}, {"key": "tokens_total", "diff": -1232.2222222222222, "lo": -1376.2222222222222, "hi": -1088.5, "p": 7.62939453125e-06, "n": 18, "base": 4880, "o <script>

  function f(x, d) { return x == null ? '–' : Number(x).toFixed(d == null ? 1 : d); }

  function cell(t, a) { return D.cells[t + '|' + a]; }

  var q = effOf('rubric'), tm = effOf('wall_s'), tk = effOf('tokens_total'), us = effOf('usable');
  if (q) vcell('Qualität (Rubrik)', pct(q.mean_a) + ' vs ' + pct(q.mean_b), 'MCP vs lokale Tools · Differenz ' + signed(q.diff * 100, 1, ' PP') + ' [' + signed(q.lo * 100, 1) + '; ' + signed(q.hi * 100, 1) + ']', q.diff > 0 ? 'pos' : 'neg');

  var lg = el('div', { class: 'legend' }); ARMS.slice().reverse().forEach(function (a) { lg.appendChild(el('span', null, '<i class="sw ' + a + '"></i>' + ARM_LABEL[a])); });
  s1.appendChild(lg);
  var wrap1 = el('div', { class: 'chart-wrap card' }); s1.appendChild(wrap1); $root.appendChild(s1);

  (function scatter() {
    var W = 900, H = 520, m = { l: 56, r: 24, t: 24, b: 54 };

    var svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Streudiagramm Qualität gegen Wandzeit je Aufgabe und Arm' });
