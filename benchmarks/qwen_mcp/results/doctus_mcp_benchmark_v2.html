<title>Doctus MCP-Benchmark</title>
<style>
/* Layout: ein Lesefluss, Befund oben, danach Koordinatensystem, Disziplinen, Effekte, Methodik. */
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --ink: #16181d;
  --ink-2: #4a4f59;
  --ink-3: #6e7380;
  --line: #dcdde2;
  --grid: #ebecef;
  --mcp: #2a78d6;
  --local: #eb6834;
  --none: #1baf7a;
  --good: #1f7a45;
  --bad: #b3372f;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --surface: #1a1d23; --ink: #eceef2; --ink-2: #b5bac4; --ink-3: #8b909c;
    --line: #2d313a; --grid: #23272f; --mcp: #3987e5; --local: #d95926; --none: #199e70;
    --good: #4cc27f; --bad: #ee7b72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --surface: #1a1d23; --ink: #eceef2; --ink-2: #b5bac4; --ink-3: #8b909c;
  --line: #2d313a; --grid: #23272f; --mcp: #3987e5; --local: #d95926; --none: #199e70;
  --good: #4cc27f; --bad: #ee7b72; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-inline: 20px; padding-block: 28px 64px; }
main { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(28px, 4.2vw, 42px); line-height: 1.12; }
h2 { font-size: 24px; line-height: 1.2; }
h3 { font-size: 17px; }
p { margin: 0; }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.lead { font-size: 18px; color: var(--ink-2); max-width: 68ch; }
.sec { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sec > p.sub { color: var(--ink-2); max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.sw.mcp { background: var(--mcp); } .sw.local { background: var(--local); } .sw.none { background: var(--none); }

.verdict { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.vcell { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.vcell .k { font-size: 13px; color: var(--ink-3); }
.vcell .v { font-family: var(--font-data); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.vcell .d { font-size: 13px; color: var(--ink-2); }
.pos { color: var(--good); } .neg { color: var(--bad); }

svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--font-data); fill: var(--ink-2); font-size: 11.5px; }
svg .t-strong { fill: var(--ink); }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .axis { stroke: var(--line); stroke-width: 1.2; }
.chart-wrap { position: relative; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.4; box-shadow: 0 4px 16px rgba(0,0,0,.14); z-index: 5; min-width: 150px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; font-family: var(--font-data); font-size: 12px; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
thead th { font-family: var(--font-data); font-size: 12px; color: var(--ink-3); font-weight: 500; }
.tablewrap { overflow-x: auto; }
.badge { display: inline-block; font-family: var(--font-data); font-size: 11.5px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); }
.badge.mcp { border-color: var(--mcp); color: var(--mcp); } .badge.local { border-color: var(--local); color: var(--local); } .badge.none { border-color: var(--none); color: var(--none); }
details { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--surface); }
details + details { margin-top: 8px; }
summary { cursor: pointer; font-weight: 600; font-size: 15px; }
details pre { white-space: pre-wrap; font-family: var(--font-body); font-size: 14px; color: var(--ink-2); margin: 10px 0 0; overflow-wrap: anywhere; }
.toolline { font-family: var(--font-data); font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; margin-top: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.note { font-size: 13.5px; color: var(--ink-3); max-width: 72ch; }
ul.clean { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }
.theme-toggle { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 14px; font-family: var(--font-data); font-size: 12px; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; cursor: pointer; z-index: 10; }
:focus-visible { outline: 2px solid var(--mcp); outline-offset: 2px; }
@media (max-width: 560px) { body { padding-inline: 16px; } .card { padding: 12px; } }
.nav { display: flex; flex-wrap: wrap; gap: 8px 18px; font-family: var(--font-data); font-size: 13px; }
.nav a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.nav a:hover { color: var(--ink); border-color: var(--ink-3); }
.top3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.top3 > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.part { display: flex; flex-direction: column; gap: 28px; border-top: 2px solid var(--line); padding-top: 32px; scroll-margin-top: 16px; }
details.appendix > summary { font-size: 17px; font-family: var(--font-display); }
.rowhl td { background: color-mix(in srgb, var(--mcp) 9%, var(--surface)); font-weight: 600; }
</style>

kt in der Datei `COADM01C.cbl` durchgefuehrt, sondern vermutlich in anderen Dateien, die nicht explizit genannt werden.", "tools": ["list_dir({\"path\": \"app\"})", "list_dir({\"path\": \"app/asm\"})", "grep({\"pattern\": \"COSGN00C\", \"path\": \"app/asm\"})", "grep({\"path\": \"app\", \"pattern\": \"COSGN00C\"})"]}, {"task": "C1-SIGNON", "arm": "mcp", "rubric": 0.0, "answer": "Nach erfolgreicher Anmeldung in `COSGN00C` wird als nächstes der Paragraph `SEND-SIGNON-SCREEN` gestartet. Die Auswahl hängt davon ab, ob der Wert `EIBCALEN` gleich null ist. Falls `EIBCALEN` null ist, wird `SEND-SIGNON-SCREEN` direkt aufgerufen. Andernfalls wird im `EVALUATE`-Block geprüft, ob `EIBAID` den Wert `DFHENTER` hat, und falls ja, wird `PROCESS-ENTER-KEY` aufgerufen. Wenn `EIBAID` den Wert `DFHPF3` hat, wird `SEND-PLAIN-TEXT` aufgerufen. \n\nDie Datei, die für die Prüfung der Zugangsdaten gelesen wird, ist `COSGN0AO`, wie in der Zeile `MOVE WS-MESSAGE TO ERRMSGO OF COSGN0AO` (Datei:Zeile `app/cbl/COSGN00C.cbl`:145) zu sehen ist.", "tools": ["research_project({\"project_id\": 1, \"query\": \"COSGN00C\", \"hops\": 1})", "search_code({\"include_source\": true, \"limit\": 1, \"project_id\": 1, \"query\": \"COSGN00C.MAIN-PARA\"})", "search_code({\"include_source\": true, \"limit\": 1, \"project_id\": 1, \"query\": \"COSGN00C.SEND-SIGNON-SCREE)", "search_code({\"include_source\": true, \"limit\": 1, \"project_id\": 1, \"query\": \"COSGN00C.PROCESS-ENTER-KEY)"]}, {"task": "C2-BILLPAY", "arm": "none", "rubric": 0.3636, "answer": "Die Frage bezieht sich auf den AWS CardDemo-Code, der in der Regel eine vereinfachte Demonstration für die Bearbeitung von Kreditkarten-Transaktionen enthält. Allerdings ist der spezifische Code für die Datei `COBIL00C` nicht öffentlich zugänglich oder dokumentiert, sodass ich keine konkreten Datei- und Zeilenbelege (Datei:Zeile) sowie keine genauen Programm- oder Feldnamen aus dem Code angeben kann. Daher ist die folgende Erklärung auf Basis allgemeiner Kenntnisse über solche Systeme und keine konkreten Code-Referenzen.\n\nWenn der Benutzer in einem solchen System die Zahlung mit `'Y'` bestätigt, wird die Transaktion in der Regel wie folgt verarbeitet:\n\n1. **Transaktions-ID**: Die neue Transaktions-ID wird typischerweise aus einem sequenziellen Zähler oder einem Hash aus Datum, Uhrzeit und einem anderen Identifikator gebildet. In einigen Systemen wird sie auch aus einem vordefinierten Schema generiert, z. B. `YYYYMMDDHHMMSSXXX`, wobei `XXX` eine Sequenznummer oder ein Zufallswert ist.\n\n2. **Dateien/Datasets**:\n   - **Transaktions-Datei**: Wird gelesen und geschrieben, um die Transaktion zu speichern. Beispiele: `TRANSACTIONS`, `TXN_DATA`, `COBIL00C` (wenn dies eine Transaktionsdatei ist).\n   - **Kontostand-Datei**: Wird gelesen und geschrieben, um den Kontostand zu aktualisieren. Beispiele: `ACCOUNT_BALANCES`, `ACCOUNT_DATA`.\n   - **Log-Datei**: Wird geschrieben, um die Transaktion zu protokollieren. Beispiele: `TXN_LOG`, `COBIL00L`.\n\n3. **Kontostand**: Der Kontostand wird gemäß der Transaktionsart (z. B. Lastschrift, Überweisung) reduziert. Wenn die Transaktion erfolgreich ist, wird der Betrag vom Kontostand abgezogen. Falls es einen Fehler gibt, wird der Kontostand nicht geändert.\n\nDa der genaue Code für `COBIL00C` nicht bekannt ist, können keine konkreten Datei- und Z", "tools": []}, {"task": "C2-BILLPAY", "arm": "local", "rubric": 0.0, "answer": "Die Frage bezieht sich auf den AWS CardDemo-Code, der jedoch nicht im Wurzelverzeichnis des Repositorys vorhanden ist. Daher kann ich keine konkreten Dateien, Methoden oder Feldnamen aus dem Code angeben. Es ist nicht möglich, die Funktion COBIL00C oder die entsprechenden Dateien/Datasets zu identifizieren, da sie nicht im Repository enthalten sind. Die genaue Logik der Zahlungsbestätigung mit 'Y' und die damit verbundenen Transaktions-ID-Generierung sowie Kontostand-Änderungen können daher nicht belegt werden.", "tools": []}, {"task": "C2-BILLPAY", "arm": "mcp", "rubric": 0.5455, "answer": "Wenn der Benutzer die Zahlung mit **'Y'** bestätigt, führt das Programm **COBIL00C** folgende Aktionen aus:\n\n### 1. **Verarbeitung der Bestätigung**\n- Die Bestätigung wird in der Variable **CONFIRMI OF COBIL0AI** gespeichert.\n- Wenn **CONFIRMI** den Wert **'Y'** oder **'y'** hat, wird **CONF-PAY-YES** auf **TRUE** gesetzt, und das Programm führt die Routine **READ-ACCTDAT-FILE** aus, um die Kontodaten des ausgewählten Kontos zu lesen.\n\n### 2. **Gelesene Dateien/Datasets**\n- **ACCTDAT-FILE**: Dieses Dataset wird gelesen, um den Kontostand des ausgewählten Kontos zu ermitteln. Die Variable **ACTIDINI OF COBIL0AI** enthält die Kontonummer, die zum Lesen des Kontos verwendet wird.\n\n### 3. **Neue Transaktions-ID**\n- Die neue Transaktions-ID wird aus dem Wert **ACTIDINI OF COBIL0AI** (Kontonummer) und dem aktuellen Systemdatum/Zeit gebildet. Dieser Prozess ist in der Routine **READ-ACCTDAT-FILE** oder in der Logik der Transaktions-ID-Generierung enthalten, die nicht explizit in den gezeigten Code steht, aber typisch für solche Systeme ist.\n\n### 4. **Aenderung des Kontostands**\n- Nach dem Lesen der Kontodaten wird der Kontostand geprüft. Wenn die Zahlung bestätigt wird, wird der Betrag der Transaktion vom Kontostand abgezogen. Dieser Vorgang wird in der Routine **READ-ACCTDAT-FILE** und möglicherweise in **UPDATE-ACCTDAT-FILE** (nicht explizit in den gezeigten Code) durchgeführt.\n- Die Änderung des Kontostands wird anschließend in das **ACCTDAT-FILE** geschrieben, um die aktuelle Kontostandssituation zu aktualisieren.\n\n### 5. **Geschriebene Dateien/Datasets**\n- **ACCTDAT-FILE**: Dieses Dataset wird gelesen und anschließend aktualisiert, um den neuen Kontostand zu speichern.\n- **TRANSACT-FILE**: Es wird wahrscheinlich eine neue Transaktionsaufzeichnung mit der Transaktions-ID u", "tools": ["search_code({\"project_id\": 1, \"query\": \"COBIL00C|confirm payment|Y|transaction ID|account balance\", \"i)", "get_code_entity({\"project_ sch in der Methode `doCreate()`.\n\n### Schritte in `AbstractUserLogic.doCreate()`\nDie Methode `doCreate()` durchläuft folgende Schritte:\n\n1. **Überprüfung der Berechtigung**:  \n   Vor der eigentlichen Erstellung wird die Berechtigung `CREATE` für den Benutzer-Resource geprüft. Dies geschieht durch den Aufruf der Methode `checkPermission()`, die in der Klasse `AbstractUserLogic` implementiert ist. Die Berechtigung wird über die Komponente `AuthorizationManager` geprüft, die Teil des Sicherheitsframeworks von Syncope ist.  \n   **Beispiel:**  \n   `AuthorizationManager.checkPermission(\"USER\", \"CREATE\")`  \n   **Datei:** `AbstractUserLogic.java`  \n   **Zeile:** (konkrete Zeile kann variieren, aber der Aufruf erfolgt in der `doCreate()`-Methode)\n\n2. **Erstellung des Benutzers**:  \n   Nach der Berechtigungsprüfung wird der Benutzer im Backend (z. B. in der Datenbank) erstellt. Dies geschieht durch die Methode `createUser()`, die in der Klasse `UserManager` implementiert ist.  \n   **Beispiel:**  \n   `userManager.createUser(user);`  \n   **Datei:** `AbstractUserLogic.java`  \n   **Zeile:** (wird in der `doCreate()`-Methode aufgerufen)\n\n3. **Provisionierung**:  \n   Die eigentliche Provisionierung (d. h. die Synchronisation des Benutzers mit externen Systemen wie LDAP, Active Directory oder anderen Identity-Providern) wird durch die Komponente `ProvisioningManager` ausgelöst.  \n   **Beispiel:**  \n   `provisioningManager.provision(user);`  \n   **Datei:** `AbstractUserLogic.java`  ", "tools": []}, {"task": "J3-CREATE-USER", "arm": "local", "rubric": 0.0909, "answer": "Die Suche nach `UserLogic.create` im Quellcode ergab keine Treffer. Es ist daher nicht möglich, direkt auf die Implementierung oder die Verwendung der Methode `UserLogic.create` im Kontext von Apache Syncope zu verweisen. \n\nZusätzlich wurde versucht, den Quellcode der Datei `AbstractUserLogic.java` zu inspizieren, doch der Pfad existiert nicht. Somit können keine konkreten Informationen zur Methode `doCreate` oder zur Berechtigung, die geprüft wird, direkt aus dem Quellcode abgeleitet werden. \n\nEs ist möglich, dass die Methode `doCreate` in einer abgeleiteten Klasse implementiert ist, oder dass die Berechtigung in einer anderen Komponente geprüft wird. Ohne direkten Zugriff auf die relevanten Dateien oder eine weitere Suche nach dem Muster `AbstractUserLogic.doCreate` oder Berechtigungsprüfung kann keine präzise Antwort gegeben werden.", "tools": ["list_dir({\"path\": \"src/main/java\"})", "list_dir({\"path\": \"src/main/java/org/apache/syncope/core/logic\"})", "list_dir({\"path\": \"src/main/java/org/apache/syncope\"})", "list_dir({\"path\": \"src/main/java/org/apache/syncope/core\"})", "list_dir({\"path\": \"src/main/java/org/apache/syncope/core/logic\"})", "list_dir({\"path\": \"src/main/java/org/apache/syncope/core/logic/AbstractUserLogic.java\"})", "grep({\"pattern\": \"UserLogic\\\\.create\", \"path\": \"src/main/java\"})", "grep({\"path\": \"src\", \"pattern\": \"UserLogic\\\\.create\"})"]}, {"task": "J3-CREATE-USER", "arm": "mcp", "rubric": 0.0909, "answer": "In Apache Syncope wird ein Benutzer über die Methode `UserLogic.create` angelegt. Diese Methode ist in der Datei `fit/core-reference/src/test/java/org/apache/syncope/fit/AbstractITCase.java` (Zeile 741) definiert. Sie ruft die `USER_SERVICE.create(req)`-Methode auf, um die Erstellung des Benutzers zu initiieren. Bei einem erfolgreichen Antwortstatus (Status 201 CREATED) wird die Antwort weiter verarbeitet und ein `ProvisioningResult<UserTO>` zurückgegeben.\n\nIn der Methode `AbstractUserLogic.doCreate` (die in der Datei `core/persistence-neo4j/src/test/java/org/apache/syncope/core/persistence/neo4j/inner/MultitenancyTest.java` (Zeile 78) als Testmethode vorkommt) werden die Schritte der Benutzererstellung detailliert. Hier wird ein Benutzerobjekt erstellt, dessen Eigenschaften wie Realm, Passwort, Benutzername usw. gesetzt werden. Anschließend wird das Objekt mit `userDAO.save(user)` gespeichert, was die eigentliche Persistierung im System auslöst.\n\nDie Berechtigung, die geprüft wird, ist `checkPermission`, was in der Datei `core/persistence-neo4j/src/test/java/org/apache/syncope/core/persistence/neo4j/inner/MultitenancyTest.java` (Zeile 78) als Teil der Testmethode `createUser` vorkommt. Diese Prüfung stellt sicher, dass der Benutzer die notwendigen Berechtigungen besitzt, um erstellt zu werden.\n\nDie eigentliche Provisionierung wird von der Komponente `provisioning` durchgeführt, die in der Datei `fit/build-tools/src/main/java/org/apache/syncope/fit/buildtools/SyncopeBuildToolsApplication.java` (Zeile 85) als Bean definiert ist. Diese Komponente ist verantwortlich für die Ausführung der tatsächlichen Benutzererstellung und der damit verbundenen Datenbankoperationen.", "tools": ["search_code({\"project_id\": 2, \"query\": \"UserLogic.create|AbstractUserLogic.doCreate|createUser|provisi)", "search_code({\"include_source\": true, \"project_id\": 2, \"query\": \"AbstractUserLogic.doCreate|provisionin)"]}], "truncated_outputs": 21, "n_sessions": 90}, "N": {"lead": "Qwen3-8B beantwortet sechs Fragen zu COBOL- und Java-Code in drei Varianten: ohne Werkzeuge, mit einfachen lokalen Dateitools und mit der Doctus-MCP-Schnittstelle. 90 Sitzungen, alle Zahlen gepaart und vorab festgelegt. Kurz gesagt: MCP macht das Modell nicht schneller und braucht mehr als doppelt so viele Tokens. Es liefert aber als einzige Variante überhaupt brauchbare Antworten, und zwar bei COBOL.", "findings": ["<b>Qualität:<\/b> Mit MCP erfüllt das Modell im Mittel 20 % der Rubrikpunkte, mit lokalen Dateitools 9 %, ohne Werkzeuge 18 %. Der Vorsprung von MCP vor den lokalen Tools beträgt 11 Prozentpunkte, das Konfidenzintervall reicht aber von −9 bis +31 (p = 0,06). Das ist nach dem vorab festgelegten Maßstab (p &lt; 0,0125) <b>nicht abgesichert<\/b>.", "<b>Der Wert ohne Werkzeuge täuscht:<\/b> Neun Rubrikpunkte trifft das Modell auch ohne Code, aus Allgemeinwissen (zum Beispiel „Passwort“, „MFA“, „Provisioning“). Lässt man sie weg, sinken die Werte auf 2 % (ohne Werkzeuge), 3 % (lokale Tools) und 10 % (MCP). Auf den spezifischen Punkten liegt MCP um 8,6 Prozentpunkte vor „ohne Werkzeuge“ (p = 0,012). Diese Auswertung wurde nachträglich ergänzt und ist explorativ.", "<b>Nutzbar (mindestens 50 % der Punkte):<\/b> MCP erreicht das in 7 von 30 Sitzungen (23 %), die lokalen Tools in 1 von 30 (3 %), ohne Werkzeuge nie (0 %). Alle sieben MCP-Treffer stammen aus den COBOL-Aufgaben Datenzugriff (C2) und Regeln und Batch (C3). Der Unterschied ist nach Korrektur nicht signifikant (p = 0,07), aber es ist die einzige Kennzahl, bei der MCP klar absetzt.", "<b>Geschwindigkeit:<\/b> Kein belastbarer Unterschied. MCP braucht im Mittel 14,3 s, die lokalen Tools 11,9 s (+2,4 s, Intervall −4,3 bis +10,5 s, p = 0,33). Je Aufgabe schwankt es stark: MCP ist bei den drei Java-Aufgaben schneller, bei den COBOL-Aufgaben C2 und C3 deutlich langsamer. Die Java-Zeiten sind kurz, weil das Modell dort nach leeren Suchtreffern früh aufgibt.", "<b>Tokens:<\/b> MCP verbraucht 12.243 Tokens je Antwort, die lokalen Tools 5.426, ohne Werkzeuge 925. Das ist ein Plus von 126 % gegenüber den lokalen Tools (p = 0,0006) und das einzige klar signifikante Ergebnis zu Ungunsten von MCP. Die Werkzeugausgabe füllt den Kontext von 8.192 Tokens, in 21 Fällen wurde sie auf 6.000 Zeichen gekürzt.", "<b>Werkzeugnutzung:<\/b> MCP wurde in allen 30 Sitzungen benutzt, die lokalen Dateitools nur in 16 von 30. In 14 Sitzungen antwortete das Modell ohne einen Blick in den Code und behauptete mehrfach, der Code sei nicht im Repository. Von 124 lokalen Aufrufen scheiterten 98, meist auf geratenen Pfaden wie <code>src/main/java<\/code>. Bei MCP scheiterten nur 0,3 Aufrufe je Sitzung.", "<b>Warum MCP bei Java scheitert:<\/b> Der Index von Syncope enthält die Klasse <code>AuthDataAccessor<\/code> und ihre Methoden. Die Suche nach <code>AuthDataAccessor.authenticate<\/code> liefert trotzdem 0 Treffer, nur <code>AuthDataAccessor#authenticate<\/code> findet sie. In 14 von 15 Java-Sitzungen mit MCP gab es mindestens eine leere Suche. Bei J1 bis J3 erreicht MCP keinen einzigen spezifischen Rubrikpunkt. Das ist ein Defekt der Schnittstelle bei Java (die Form <code>Klasse.methode<\/code> wird nicht normalisiert, obwohl das laut TODO O-355 vorgesehen ist) und kein Mangel des Modells.", "<b>Warum MCP bei C1 scheitert:<\/b> Die Suche liefert den Einstieg korrekt. Das Modell verfolgt dann aber den Call-Flow (<code>SEND-SIGNON-SCREEN<\/code>, <code>PROCESS-ENTER-KEY<\/code>) und liest nie die Stelle, an der <code>READ-USER-SEC-FILE<\/code> die Weiterleitung auswählt. Den vorgeschlagenen Folgeaufruf <code>get_code_entity<\/code> ignoriert es.", "<b>Belegtreue:<\/b> Von den zitierten Dateien gibt es im Checkout 95 % (MCP), 82 % (lokale Tools) und 56 % (ohne Werkzeuge, dort erfindet das Modell Dateinamen). Es wurden insgesamt nur 76 Dateizitate gezählt, die Zahlen sind deshalb grob."], "method": ["<b>Modell:<\/b> Qwen3-8B (Q4) in Ollama, 8-GB-GPU, Kontext 8.192 Tokens (Doctus-Standard), Temperatur 0,3, kein Denkmodus. Chat- und Embedding-Modell liegen gleichzeitig vollständig auf der GPU.", "<b>Design:<\/b> 6 Aufgaben × 3 Varianten × 5 Wiederholungen = 90 Sitzungen. Je (Aufgabe, Wiederholung) gleicher Seed, Reihenfolge der Varianten zufällig gemischt. Hauptvergleich: MCP gegen lokale Dateitools.", "<b>Aufgaben:<\/b> Drei COBOL-Fragen (AWS CardDemo) und drei Java-Fragen (Apache Syncope) mit festem Commit und Sollantwort an Datei und Zeile. Beide Bestände sind vollständig in Doctus indexiert.", "<b>Bewertung:<\/b> Deterministische Rubrik aus gewichteten Punkten mit festen Suchmustern, kein KI-Richter. Rubrik und Protokoll wurden vor dem ersten Lauf per Prüfsumme eingefroren.", "<b>Statistik:<\/b> Gepaarte Differenzen, 95-%-Konfidenzintervall per Bootstrap über Aufgaben, exakter Permutationstest. Für die vier Hauptkennzahlen gilt die Schwelle p &lt; 0,0125.", "<b>Abweichungen:<\/b> Eine Sitzung (J1, ohne Werkzeuge, Wiederholung 4) fiel durch einen Speicherfehler von Ollama aus und wurde mit gleichem Seed wiederholt. Die Kennzahlen „Werkzeug genutzt“ und „Qualität ohne erratbare Punkte“ wurden nachträglich ergänzt. Beides ist in <code>ANALYSIS_NOTES.md<\/code> festgehalten."], "limits": ["Ein Modell, eine Quantisierung, ein Rechner. Die Aussagen gelten nicht für größere Modelle.", "Nur sechs Aufgaben aus zwei Beständen. Aufgabenweise Zahlen beruhen auf je fünf Läufen und sind beschreibend.", "Die Rubrik prüft Begriffe, keine Bedeutung. Korrekte, anders formulierte Antworten können durchfallen, sprachlich passende, aber falsche Antworten können Punkte bekommen. Eine unabhängige menschliche Zweitbewertung steht aus.", "Die lokalen Dateitools sind selbst gebaut. Das Modell scheitert dort oft an geratenen Pfaden, und <code>list_dir<\/code> meldet fehlende Pfade nur mit „kein Verzeichnis“. Mit besseren Fehlermeldungen oder einem Repository-Überblick könnte der lokale Arm besser abschneiden.", "Der Kontext von 8.192 Tokens begünstigt Varianten mit wenig Werkzeugausgabe. Mit größerem Kontext würde MCP vermutlich weniger oft gekürzt, das war auf dieser GPU zusammen mit dem Embedding-Modell nicht messbar.", "Das schlechte Java-Ergebnis von MCP geht auf die Suchformulierung zurück. Ob das Modell nach einer Korrektur die Quellen auch verwertet, ist nicht gemessen."]}, "chap": {"model": "Qwen3-8B", "short": "Qwen3-8B", "eyebrow": "Kapitel 1 · Qwen3-8B lokal in Ollama", "title": "Kapitel 1: Qwen3-8B, lokal auf der 8-GB-GPU", "armLabel": {"none": "ohne Werkzeuge", "local": "lokale Dateitools", "mcp": "mit MCP"}, "footer": "Modell qwen3:8b · Ollama · Kontext 8192 · Temperatur 0,3 · eigener Harness"}}, {"D": {"meta": {"model": "gpt-6-luna", "reasoning_effort": "medium", "agent": "codex-cli 0.160.0", "options": {"reasoning_effort": "medium", "session_timeout": 600}, "ollama_version": null, "model_digests": {}, "started": "2026-10-02T15:31:55+0200", "tasks_sha2  stammt ([COSGN00C.cbl](/home/maxde/.codex_bench/corpus/carddemo/app/cbl/COSGN00C.cbl:227)).\n\nDie Zugangsdatenprüfung liest die CICS-Datei `USRSEC`: `WS-USRSEC-FILE` ist mit `'USRSEC  '` belegt, und `READ-USER-SEC-FILE` liest sie per `EXEC CICS READ` ([COSGN00C.cbl](/home/maxde/.codex_bench/corpus/carddemo/app/cbl/COSGN00C.cbl:39), [COSGN00C.cbl](/home/maxde/.codex_bench/corpus/carddemo/app/cbl/COSGN00C.cbl:209)). Der Datensatz wird über `WS-USER-ID` gesucht; anschließend wird `SEC-USR-PWD` mit `WS-USER-PWD` verglichen ([COSGN00C.cbl](/home/maxde/.codex_bench/corpus/carddemo/app/cbl/COSGN00C.cbl:215), [COSGN00C.cbl](/home/maxde/.codex_bench/corpus/carddemo/app/cbl/COSGN00C.cbl:223)).", "tools": ["shell({\"command\": \"/bin/bash -lc 'rg -n \\\"COSGN00C|password|credential|sign.?on|sign.?in\\\" app R)", "shell({\"command\": \"/bin/bash -lc \\\"nl -ba app/cbl/COSGN00C.cbl | sed -n '1,260p'; rg -n \\\\\\\"CDEM)"]}, {"task": "C1-SIGNON", "arm": "mcp", "rubric": 1.0, "answer": "Nach erfolgreicher Anmeldung startet `COSGN00C` abhängig vom Benutzertyp ein Programm: Bei `CDEMO-USRTYP-ADMIN` wird per `XCTL` `COADM01C` aufgerufen, andernfalls `COMEN01C` (`app/cbl/COSGN00C.cbl:231–238`). Der Benutzertyp `CDEMO-USER-TYPE` wird zuvor aus `SEC-USR-TYPE` übernommen (`app/cbl/COSGN00C.cbl:225–228`).\n\nFür die Prüfung liest `READ-USER-SEC-FILE` per `EXEC CICS READ` den Datensatz aus dem Dataset in `WS-USRSEC-FILE`; als Schlüssel dient `WS-USER-ID` (`app/cbl/COSGN00C.cbl:209–218`). Der Vergleich des gelesenen `SEC-USR-PWD` mit `WS-USER-PWD` erfolgt in `app/cbl/COSGN00C.cbl:221–222`. Der konkrete Dateiname hinter `WS-USRSEC-FILE` ist durch diese Belege nicht ersichtlich.", "tools": ["search_code({\"project_id\": 1, \"query\": \"COSGN00C\", \"include_source\": true})", "get_code_entity({\"project_id\": 1, \"entity_id\": 8195, \"max_chars\": 7000})", "get_code_entity({\"project_id\": 1, \"entity_id\": 8199, \"max_chars\": 8000})", "get_code_entity({\"project_id\": 1, \"entity_id\": 8191, \"max_chars\": 8000})"]}, {"task": "C2-BILLPAY", "arm": "none", "rubric": 0.0, "answer": "Ohne Zugriff auf den Quellcode kann ich die Abläufe von `COBIL00C` sowie die betroffenen Dateien oder Datasets, die Bildung der Transaktions-ID und die Änderung des Kontostands nicht verlässlich belegen. Konkrete Datei- und Zeilenangaben zu nennen, wäre daher unbelegt.", "tools": []}, {"task": "C2-BILLPAY", "arm": "local", "rubric": 1.0, "answer": "Bei `CONFIRMI` mit `Y` oder `y` setzt `COBIL00C` `CONF-PAY-YES` und liest den Kontodatensatz (`COBIL00C.cbl:173–177`). Voraussetzung ist, dass die Konto-ID angegeben und gültig ist und der aktuelle Saldo größer als null ist (`COBIL00C.cbl:159–167, 197–205`).\n\nDer Ablauf liest und ändert diese Dateien beziehungsweise Datasets:\n\n- **`ACCTDAT`**: `READ-ACCTDAT-FILE` liest den Datensatz mit `ACCT-ID` als Schlüssel und `UPDATE`-Option; danach wird derselbe Datensatz mit `REWRITE` zurückgeschrieben (`COBIL00C.cbl:343–354, 377–385`). Der Dateiname `ACCTDAT` steht in `WS-ACCTDAT-FILE` (`COBIL00C.cbl:41`).\n- **`CXACAIX`**: `READ-CXACAIX-FILE` liest den Kartenreferenzdatensatz anhand von `XREF-ACCT-ID`; daraus übernimmt das Programm `XREF-CARD-NUM` in die Zahlungstransaktion (`COBIL00C.cbl:210–211, 408–418, 225`). Der Dateiname steht in `WS-CXACAIX-FILE` (`COBIL00C.cbl:42`).\n- **`TRANSACT`**: Das Programm startet mit `TRAN-ID = HIGH-VALUES` einen Rückwärts-Browse, liest den vorherigen Datensatz und beendet den Browse (`COBIL00C.cbl:212–215, 441–449, 472–482, 501–505`). Anschließend schreibt es einen neuen `TRAN-RECORD` in `TRANSACT` (`COBIL00C.cbl:218–233, 510–520`). Der Dateiname steht in `WS-TRANSACT-FILE` (`COBIL00C.cbl:40`).\n\nDie neu gebildete Transaktions-ID entsteht, indem `TRAN-ID` des zuletzt gelesenen Datensatzes nach `WS-TRAN-ID-NUM` übertragen und um eins erhöht wird. Bei `ENDFILE` setzt `READPREV-TRANSACT-FILE` die ID stattdessen auf Nullen; in diesem Fall ergibt sich die erste ID durch Addition ebenfalls als 1. Das Ergebnis wird als neue `TRAN-ID` eingetragen (`COBIL00C.cbl:216–219, 484–489`). `TRAN-ID` ist im Record als `PIC X(16)` definiert, der Arbeitswert `WS-TRAN-ID-NUM` als `PIC 9(16)` (`CVTRA05Y.cpy:4–5; COBIL00C.cbl:57`).\n\nDer neue Transaktionsdatensatz erhäl", "tools": ["shell({\"command\": \"/bin/bash -lc 'rg -n \\\"COBIL00C|COBIL00\\\" .'\"})", "shell({\"command\": \"/bin/bash -lc \\\"nl -ba app/cbl/COBIL00C.cbl | sed -n '1,380p'; rg -n \\\\\\\"FD|S)", "shell({\"command\": \"/bin/bash -lc \\\"nl -ba app/cbl/COBIL00C.cbl | sed -n '375,560p'; rg -n \\\\\\\"01)", "shell({\"command\": \"/bin/bash -lc 'nl -ba app/cpy/CVTRA05Y.cpy; nl -ba app/cpy/CVACT01Y.cpy; nl -)"]}, {"task": "C2-BILLPAY", "arm": "mcp", "rubric": 0.8182, "answer": "Wenn `CONFIRMI` den Wert `'Y'` oder `'y'` hat, setzt `PROCESS-ENTER-KEY` `CONF-PAY-YES` und ruft `READ-ACCTDAT-FILE` auf (`app/cbl/COBIL00C.cbl:174–178`). Die Zahlung wird nur weiterverarbeitet, wenn kein Fehler vorliegt und der Kontostand positiv ist; andernfalls wird eine Fehlermeldung angezeigt (`app/cbl/COBIL00C.cbl:197–213`).\n\nBei erfolgreicher Verarbeitung liest COBIL00C diese Datenbestände:\n\n- `WS-ACCTDAT-FILE`: `READ` des Kontodatensatzes `ACCOUNT-RECORD` mit `UPDATE`; Schlüssel ist `ACCT-ID` (`app/cbl/COBIL00C.cbl:343–353`).\n- `WS-CXACAIX-FILE`: `READ` des Kartenreferenzdatensatzes `CARD-XREF-RECORD`, mit `XREF-ACCT-ID` als Schlüssel (`app/cbl/COBIL00C.cbl:408–418`).\n- `WS-TRANSACT-FILE`: startet einen Rückwärts-Browse mit `STARTBR` und liest den vorherigen Datensatz per `READPREV` (`app/cbl/COBIL00C.cbl:441–449`, `472–480`).\n\nDann wird die neue Transaktions-ID gebildet: COBIL00C setzt `TRAN-ID` auf `HIGH-VALUES`, liest damit den vorherigen beziehungsweise höchsten Transaktionsdatensatz, übernimmt dessen ID in `WS-TRAN-ID-NUM` und addiert 1. Bei `ENDFILE` setzt `READPREV-TRANSACT-FILE` die ID auf Nullen. Der so berechnete Wert wird in `TRAN-ID` gespeichert (`app/cbl/COBIL00C.cbl:214–223`, `app/cbl/COBIL00C.cbl:488–490`).\n\nDer neue `TRAN-RECORD` erhält den Typcode `'02'`, Kategorie `2`, Quelle `'POS TERM'`, Beschreibung `'BILL PAYMENT - ONLINE'`, Betrag `ACCT-CURR-BAL`, die Kartennummer aus `XREF-CARD-NUM` sowie Händler-ID `999999999` und Händlername `'BILL PAYMENT'` (`app/cbl/COBIL00C.cbl:223–230`). COBIL00C setzt außerdem Händlerstadt und -Postleitzahl auf `'N/A'` sowie Ursprungs- und Verarbeitungszeitstempel auf den aktuellen Zeitstempel (`app/cbl/COBIL00C.cbl:231–235`).\n\nAnschließend schreibt `WRITE-TRANSACT-FILE` den Datensatz `TRAN-RECORD` in `WS-TRANSACT-", "tools": ["research_project({\"project_id\": 1, \"query\": \"COBIL00C\", \"hops\": 2, \"limit\": 10})", "get_code_entity({\"project_id\": 1, \"entity_id\": 7702, \"max_chars\": 15000})", "get_code_entity({\"project_id\": 1, \"entity_id\": 7708, \"max_chars\": 15000})", "search_code({\"project_id\": 1, \"query\": \"WRITE-TRANSACT-FILE|UPDATE-ACCTDAT-FILE|READ-CXACAIX-FILE|STAR)", "get_code_entity({\"project_id\": 1, \"entity_id\": 7710, \"max_chars\": 10000})", "get_code_entity({\"project_id\": 1, \"entity_id\": 7711, \"max_chars\": 10000})", "get_code_entity({\"project_id\": 1, \"entity_id\": 7712, \"max_chars\": 10000})"]}, {"task": "C3-POSTING", "arm": "none", "rubric": 0.0, "answer": "**Für `CBTRN02C` kann ich die konkreten Validierungen, Ablehnungscodes und Dateizugriffe hier nicht belegen.** In dieser Sitzung stehen mir weder Quellcode noch Werkzeuge zur Verfügung; Datei- und Zeilenangaben oder Details aus dem Gedächtnis zu nennen, würde daher gegen deine Vorgabe verstoßen, nichts zu erfinden.", "tools": []}, {"task": "C3-POSTING", "arm": "local", "rubric": 1.0, "answer": "CBTRN02C liest je Tagesdatensatz aus `DALYTRAN-FILE`, setzt den Ablehnungsgrund zunächst auf 0 und ruft `1500-VALIDATE-TRAN` auf. Nur bei Grund 0 wird gebucht; andernfalls erhöht das Programm den Ablehnungszähler und schreibt einen Reject-Datensatz (`app/cbl/CBTRN02C.cbl:202-216`).\n\nDie im Code implementierten Validierungen sind:\n\n- **100 – `INVALID CARD NUMBER FOUND`:** Die Kartennummer `DALYTRAN-CARD-NUM` wird in `XREF-FILE` nachgeschlagen. Ein `INVALID KEY` ergibt Ablehnung 100 (`app/cbl/CBTRN02C.cbl:380-391`).\n- **101 – `ACCOUNT RECORD NOT FOUND`:** Nach erfolgreichem Kartenabgleich wird das zugehörige Konto anhand von `XREF-ACCT-ID` in `ACCOUNT-FILE` gesucht. `INVALID KEY` ergibt Ablehnung 101 (`app/cbl/CBTRN02C.cbl:393-400`).\n- **102 – `OVERLIMIT TRANSACTION`:** Bei gefundenem Konto berechnet das Programm `WS-TEMP-BAL` als `ACCT-CURR-CYC-CREDIT - ACCT-CURR-CYC-DEBIT + DALYTRAN-AMT`. Wenn `ACCT-CREDIT-LIMIT` kleiner als dieser Wert ist, wird 102 gesetzt (`app/cbl/CBTRN02C.cbl:403-413`).\n- **103 – `TRANSACTION RECEIVED AFTER ACCT EXPIRATION`:** Wenn `ACCT-EXPIRAION-DATE` vor dem Datumsteil `DALYTRAN-ORIG-TS (1:10)` liegt, wird 103 gesetzt (`app/cbl/CBTRN02C.cbl:414-420`).\n\nDie Validierungen 102 und 103 sind separate `IF`-Blöcke. Wenn beide fehlschlagen, setzt der zweite Block den gespeicherten Ablehnungsgrund auf 103. Weitere Validierungen sind im Programm nur als Kommentar „ADD MORE VALIDATIONS HERE“ angekündigt; konkrete weitere Bedingungen sind dort nicht implementiert (`app/cbl/CBTRN02C.cbl:370-378`).\n\n**Abgelehnte Transaktionen:** `2500-WRITE-REJECT-REC` kopiert den ursprünglichen `DALYTRAN-RECORD` in `REJECT-TRAN-DATA` und den Validierungstrailer in `VALIDATION-TRAILER`, dann schreibt es den Datensatz in `DALYREJS-FILE` (`app/cbl/CBTRN02C.cbl:446-464`). Der Tr", "tools": ["shell({\"command\": \"/bin/bash -lc 'rg -n \\\"CBTRN02C|REJECT|DECLIN|TRANSACTION\\\" app samples'\"})", "shell({\"command\": \"/bin/bash -lc \\\"nl -ba app/cbl/CBTRN02C.cbl | sed -n '1,760p'\\\"\"})", "shell({\"command\": \"/bin/bash -lc \\\"nl -ba app/cbl/CBTRN02C.cbl | sed -n '230,505p'; nl -ba app/j)"]}, {"task": "C3-POSTING", "arm": "mcp", "rubric": 0.8333, "answer": "CBTRN02C prüft eine Tagestransaktion in `1500-VALIDATE-TRAN`: erst wird die Kartennummer in `XREF-FILE` gesucht. Nur wenn dabei kein Fehler gesetzt wird, wird das zugehörige Konto in `ACCOUNT-FILE` gesucht und weiter geprüft (`app/cbl/CBTRN02C.cbl:370–378`).\n\nDie Validierungen und Ablehnungscodes sind:\n\n- **100 – ungültige Kartennummer:** Der `READ XREF-FILE` endet mit `INVALID KEY`; `WS-VALIDATION-FAIL-REASON` wird auf 100 und die Beschreibung auf `INVALID CARD NUMBER FOUND` gesetzt (`app/cbl/CBTRN02C.cbl:380–391`).\n- **101 – Kontodatensatz fehlt:** Der `READ ACCOUNT-FILE` endet mit `INVALID KEY`; der Code wird 101 und die Beschreibung `ACCOUNT RECORD NOT FOUND` (`app/cbl/CBTRN02C.cbl:393–404`).\n- **102 – Transaktion über Kreditlimit:** Für ein gefundenes Konto berechnet das Programm `WS-TEMP-BAL = ACCT-CURR-CYC-CREDIT - ACCT-CURR-CYC-DEBIT + DALYTRAN-AMT`. Ist `ACCT-CREDIT-LIMIT` kleiner als dieser Betrag, setzt es Code 102 und `OVERLIMIT TRANSACTION` (`app/cbl/CBTRN02C.cbl:393–416`).\n- **103 – Transaktion nach Ablauf des Kontos:** Wenn `ACCT-EXPIRAION-DATE` vor `DALYTRAN-ORIG-TS (1:10)` liegt, setzt das Programm Code 103 und `TRANSACTION RECEIVED AFTER ACCT EXPIRATION` (`app/cbl/CBTRN02C.cbl:416–422`).\n\nBei einer Ablehnung schreibt `2500-WRITE-REJECT-REC` den ursprünglichen `DALYTRAN-RECORD` samt `WS-VALIDATION-TRAILER` in `FD-REJS-RECORD` (`app/cbl/CBTRN02C.cbl:446–457`). Bei Erfolg der Validierung ruft der Hauptablauf `2000-POST-TRANSACTION` auf; diese Routine aktualisiert `TCATBAL-FILE` und das Konto und schreibt den Transaktionsdatensatz in die Transaktionsdatei (`app/cbl/CBTRN02C.cbl:424–444`). Für `TCATBAL-FILE` legt sie bei fehlendem Schlüssel einen Datensatz an, sonst schreibt sie den bestehenden mit `REWRITE` fort (`app/cbl/CBTRN02C.cbl:467–501`, `503–536`).", "tools": ["search_code({\"project_id\": 1, \"query\": \"CBTRN02C\", \"include_source\": true, \"limit\": 10})", "get_code_entity({\"project_id\": 1, \"entity_id\": 7105, \"start_line\": 345, \"end_line\": 727, \"max_chars\": 3000)", "get_code_entity({\"project_id\": 1, \"entity_id\": 7105, \"chunk_id\": 170126, \"char_offset\": 228, \"max_chars\": )", "get_code_entity({\"project_id\": 1, \"entity_id\": 7105, \"chunk_id\": 170132, \"char_offset\": 455, \"max_chars\": )", "get_code_entity({\"project_id\": 1, \"entity_id\": 7105, \"start_line\": 190, \"end_line\": 235, \"max_chars\": 1200)", "get_code_entity({\"project_id\": 1, \"entity_id\": 7105, \"start_line\": 130, \"end_line\": 235, \"max_chars\": 1000)", "get_code_entity({\"project_id\": 1, \"entity_id\": 7105, \"start_line\": 190, \"end_line\": 234, \"max_chars\": 3000)", "research_project({\"project_id\": 1, \"query\": \"CBTRN02C rejected transaction validation fail reason accept re)"]}, {"task": "J1-AUTHENTICATE", "arm": "none", "rubric": 0.0769, "answer": "Ich kann die Implementierung von `AuthDataAccessor.authenticate` ohne Zugriff auf den Quellcode nicht zuverlässig belegen. Daher kann ich weder die genaue Reihenfolge der Prüfungen noch das Verhalten bei Pass-through-Ressourcen, MFA oder Erfolg und Misserfolg mit konkreten Datei- und Zeilenangaben beschreiben. Alles Konkretere wäre unbelegt.", "tools": []}, {"task": "J1-AUTHENTICATE", "arm": "local", "rubric": 0.8462, "answer": "`AuthDataAccessor.authenticate(Optional<Domain>, Authentication)` bestimmt zunächst den `domainKey` aus der Domain oder verwendet `MASTER_DOMAIN` und liest für diese Domain die Einstellung `MFA_ENABLED` (`AuthDataAccessor.java:523–525`). Danach behandelt die Methode zuerst den konfigurierten anonymen Benutzernamen (`:527–529`) und anschließend den Admin-Benutzernamen (`:530–532`) über eigene Methoden. Für diese beiden Sonderfälle gilt der unten beschriebene normale Benutzerpfad nicht.\n\nIm normalen Pfad sucht sie den Benutzer anhand der konfigurierten `AUTHENTICATION_ATTRIBUTES`; voreingestellt ist `username` (`:534–538`). Beim Attribut `username` fragt sie `userDAO.findByUsername` ab (`:539–541`). Andere Attribute werden als Gleichheitsbedingung durchsucht; ein Treffer wird nur übernommen, wenn genau ein Benutzer gefunden wurde (`:542–550`). Ein ungültiger Suchausdruck wird protokolliert (`:552–554`). Wird kein Benutzer ermittelt, endet die Authentifizierung mit `UsernameNotFoundException` (`:558–560`); andernfalls ruft die Methode `authenticateUser` auf (`:562`).\n\n`authenticateUser` prüft vor dem Passwort, ob der Benutzer suspendiert ist und ob sein Status in `AUTHENTICATION_STATUSES` erlaubt ist. Beides führt bei negativem Ergebnis zu `DisabledException` (`AuthDataAccessor.java:410–418`). Ist MFA aktiviert, wird das Credential am letzten Doppelpunkt in Passwort und OTP geteilt; andernfalls wird das gesamte Credential als Passwort verwendet (`:420–428`). Anschließend verifiziert der Code das Passwort zunächst intern mit `encryptorManager.getInstance().verify(...)` gegen den gespeicherten Cipher-Algorithmus und das gespeicherte Passwort (`:430–432`).\n\nNur wenn diese interne Prüfung fehlschlägt, versucht die Schleife der Reihe nach die `getPassthroughResources(user)` (`:", "tools": ["shell({\"command\": \"/bin/bash -lc \\\"rg -n \\\\\\\"authenticate\\\\\\\\(\\\\\\\" core common client\\\"\"})", "shell({\"command\": \"/bin/bash -lc \\\"nl -ba core/spring/src/main/java/org/apache/syncope/core/spri)"]}, {"task": "J1-AUTHENTICATE", "arm": "mcp", "rubric": 1.0, "answer": "`AuthDataAccessor.authenticate(Optional<Domain>, Authentication)` arbeitet in dieser Reihenfolge ([AuthDataAccessor.java:522–563](core/spring/src/main/java/org/apache/syncope/core/spring/security/AuthDataAccessor.java:522)):\n\n1. Es bestimmt den Domain-Schlüssel und liest `MFA_ENABLED`. Stimmen Anmeldename und `securityProperties.getAnonymousUser()` überein, geht es direkt zu `authenticateAnonymous`; beim Admin-Anmeldenamen zu `authenticateAdmin`. Erst danach sucht es normale Benutzerkonten ([AuthDataAccessor.java:524–537](core/spring/src/main/java/org/apache/syncope/core/spring/security/AuthDataAccessor.java:524)).\n2. Für die Benutzersuche liest es `AUTHENTICATION_ATTRIBUTES` (Standard: `username`). Bei `username` sucht `userDAO.findByUsername`; für andere konfigurierte Attribute sucht `anySearchDAO` nach Gleichheit und übernimmt das Konto nur bei genau einem Treffer. Fehlt ein eindeutiger Benutzer, wird `UsernameNotFoundException` ausgelöst ([AuthDataAccessor.java:534–560](core/spring/src/main/java/org/apache/syncope/core/spring/security/AuthDataAccessor.java:534)).\n3. `authenticateUser` prüft zuerst, ob das Konto suspendiert ist, und ob sein Status in `AUTHENTICATION_STATUSES` erlaubt ist. Bei Sperre oder nicht zugelassenem Status folgt `DisabledException` ([AuthDataAccessor.java:404–420](core/spring/src/main/java/org/apache/syncope/core/spring/security/AuthDataAccessor.java:404)).\n4. Ist MFA aktiviert, zerlegt die Methode die Credentials am letzten Doppelpunkt in Passwort und OTP; sonst werden die Credentials vollständig als Passwort verwendet. Zuerst vergleicht sie das Passwort mit dem intern gespeicherten Passwort (`user.getCipherAlgorithm()` und `user.getPassword()`). Nur wenn das fehlschlägt, versucht sie der Reihe nach die Pass-through-Ressourcen ([AuthDataAcces", "tools": ["search_code({\"project_id\": 2, \"query\": \"AuthDataAccessor authenticate\", \"include_source\": true, \"limit)", "research_project({\"project_id\": 2, \"query\": \"AuthDataAccessor.authenticate username password pass-through M)", "search_code({\"project_id\": 2, \"query\": \"AuthDataAccessor\", \"limit\": 20})", "search_knowledge({\"project_id\": 2, \"query\": \"Apache Syncope AuthDataAccessor authenticate pass-through MFA )", "get_code_entity({\"project_id\": 2, \"entity_id\": 86356, \"start_line\": 300, \"end_line\": 510, \"max_chars\": 140)", "get_code_entity({\"project_id\": 2, \"entity_id\": 86356, \"start_line\": 404, \"end_line\": 495, \"max_chars\": 100)", "get_code_entity({\"project_id\": 2, \"entity_id\": 86356, \"start_line\": 514, \"end_line\": 595, \"max_chars\": 100)"]}, {"task": "J2-LOCKOUT", "arm": "none", "rubric": 0.0, "answer": "Die konkrete Klasse und den Ablauf kann ich ohne Einsicht in den Apache-Syncope-Quellcode nicht zuverlässig belegen. Daher kann ich auch keine Datei- und Zeilenangaben nennen oder sicher sagen, wann die Sperre ausgelöst wird und woher das Limit stammt.", "tools": []}, {"task": "J2-LOCKOUT", "arm": "local", "rubric": 0.5455, "answer": "`UsernamePasswordAuthenticationProvider.authenticate(Authentication)` ruft `dataAccessor.authenticate(domain, authentication)` auf, nachdem es zuerst `authenticationThrottler.checkAllowed(domainKey, authenticatingPrincipal)` geprüft hat ([UsernamePasswordAuthenticationProvider.java:79–97](/home/maxde/.codex_bench/corpus/syncope/core/spring/src/main/java/org/apache/syncope/core/spring/security/UsernamePasswordAuthenticationProvider.java:79)). `AuthDataAccessor.authenticate` sucht den Benutzer anhand des konfigurierten Authentifizierungsattributs und delegiert für normale Benutzer an `authenticateUser` ([AuthDataAccessor.java:522–562](/home/maxde/.codex_bench/corpus/syncope/core/spring/src/main/java/org/apache/syncope/core/spring/security/AuthDataAccessor.java:522)).\n\nScheitert die Prüfung bei einem gefundenen Benutzer, erhöht `authenticateUser` dessen Feld `failedLogins` um eins und speichert den Benutzer ([AuthDataAccessor.java:497–511](/home/maxde/.codex_bench/corpus/syncope/core/spring/src/main/java/org/apache/syncope/core/spring/security/AuthDataAccessor.java:497)). Danach ruft der Provider bei einem fehlgeschlagenen Ergebnis `provisioningManager.suspendOnAuthFailures(...)` auf ([UsernamePasswordAuthenticationProvider.java:99–106](/home/maxde/.codex_bench/corpus/syncope/core/spring/src/main/java/org/apache/syncope/core/spring/security/UsernamePasswordAuthenticationProvider.java:99)); anschließend protokolliert er den Fehlschlag, erfasst den Versuch im Throttler und wirft je nach Ergebnis `BadCredentialsException` oder `InvalidOneTimeTokenException` ([UsernamePasswordAuthenticationProvider.java:151–167](/home/maxde/.codex_bench/corpus/syncope/core/spring/src/main/java/org/apache/syncope/core/spring/security/UsernamePasswordAuthenticationProvider.java:151)). Bei einem ", "tools": ["shell({\"command\": \"/bin/bash -lc \\\"rg -n \\\\\\\"AuthDataAccessor|\\\\\\\\.authenticate\\\\\\\\(\\\\\\\" core co)", "shell({\"command\": \"/bin/bash -lc \\\"nl -ba core/spring/src/main/java/org/apache/syncope/core/spri)", "shell({\"command\": \"/bin/bash -lc \\\"nl -ba core/spring/src/main/java/org/apache/syncope/core/spri)", "shell({\"command\": \"/bin/bash -lc \\\"nl -ba core/spring/src/main/java/org/apache/syncope/core/spri)"]}, {"task": "J2-LOCKOUT", "arm": "mcp", "rubric": 0.5455, "answer": "`AuthDataAccessor.authenticate(domain, authentication)` wird für Username/Passwort von **`UsernamePasswordAuthenticationProvider.authenticate`** aufgerufen. Die Methode ermittelt zuerst Domain und Login, lässt `authenticationThrottler.checkAllowed(domainKey, authenticatingPrincipal)` prüfen und ruft dann `dataAccessor.authenticate(...)` innerhalb von `AuthContextUtils.callAsAdmin` auf ([UsernamePasswordAuthenticationProvider.java:78–98](core/spring/src/main/java/org/apache/syncope/core/spring/security/UsernamePasswordAuthenticationProvider.java:78)).\n\nBei einem fehlgeschlagenen Ergebnis ruft der Provider für einen gefundenen Benutzer `provisioningManager.suspendOnAuthFailures(...)` auf ([UsernamePasswordAuthenticationProvider.java:99–109](core/spring/src/main/java/org/apache/syncope/core/spring/security/UsernamePasswordAuthenticationProvider.java:99)). `finalizeAuthentication` protokolliert den Fehlschlag mit `dataAccessor.audit(..., OpEvent.Outcome.FAILURE, ...)`, zeichnet danach den Fehlversuch auf und wirft je nach Ursache `BadCredentialsException` bei falschem Passwort oder `InvalidOneTimeTokenException` bei ungültigem OTP/Recovery-Code ([UsernamePasswordAuthenticationProvider.java:142–168](core/spring/src/main/java/org/apache/syncope/core/spring/security/UsernamePasswordAuthenticationProvider.java:142)). Bei Erfolg wird der Zähler für Domain und Login gelöscht ([UsernamePasswordAuthenticationProvider.java:121–141](core/spring/src/main/java/org/apache/syncope/core/spring/security/UsernamePasswordAuthenticationProvider.java:121)).\n\nDie **Anmeldedrosselung** greift beim Erreichen des Limits: `recordFailure` fügt den aktuellen Fehlversuch hinzu und sperrt, sobald `failures.size() >= throttle.getMaxAttempts()` gilt. Sie setzt dann `blockedUntil` auf die aktuelle Zeit pl", "tools": ["research_project({\"project_id\": 2, \"query\": \"AuthDataAccessor.authenticate username password failed authent)", "search_code({\"project_id\": 2, \"query\": \"AuthDataAccessor\", \"limit\": 10})", "search_knowledge({\"project_id\": 2, \"query\": \"Apache Syncope AuthDataAccessor authenticate failed login atte)", "search_code({\"project_id\": 2, \"query\": \"authenticationThrottle\", \"limit\": 12})", "search_code({\"project_id\": 2, \"query\": \"UsernamePasswordAuthenticationProvider\", \"limit\": 8})", "get_code_entity({\"project_id\": 2, \"entity_id\": 86227, \"max_chars\": 10000})", "get_code_entity({\"project_id\": 2, \"entity_id\": 86356, \"max_chars\": 10000})", "get_code_entity({\"project_id\": 2, \"entity_id\": 114451, \"max_chars\": 10000})"]}, {"task": "J3-CREATE-USER", "arm": "none", "rubric": 0.0909, "answer": "Das lässt sich ohne Zugriff auf den Apache-Syncope-Quellcode hier nicht mit konkreten Datei- und Zeilenbelegen verlässlich beantworten. Insbesondere kann ich daher weder die Schritte in `AbstractUserLogic.doCreate` noch die geprüfte Berechtigung oder die zuständige Provisionierungskomponente belegen. Konkret würde ich dafür die Implementierungen von `UserLogic.create` und `AbstractUserLogic.doCreate` sowie deren Aufrufe im Repository nachschlagen.", "tools": []}, {"task": "J3-CREATE-USER", "arm": "local", "rubric": 0.9091, "answer": "`UserLogic.create` verlangt die Berechtigung `IdRepoEntitlement.USER_CREATE` und delegiert an `doCreate(createReq, false, nullPriorityAsync)` ([UserLogic.java:133–137](<\/home/maxde/.codex_bench/corpus/syncope/core/idrepo/logic/src/main/java/org/apache/syncope/core/logic/UserLogic.java:133>)).\n\n`AbstractUserLogic.doCreate` führt diese Schritte aus ([AbstractUserLogic.java:82–109](<\/home/maxde/.codex_bench/corpus/syncope/core/idrepo/logic/src/main/java/org/apache/syncope/core/logic/AbstractUserLogic.java:82>)):\n\n1. `beforeCreate(userCR)` verarbeitet die Anfrage: `AbstractAnyLogic.beforeCreate` sucht den Realm und den User-AnyType, wendet ein passendes Realm-Template an und führt die `beforeCreate`-Aktionen des Realms aus ([AbstractAnyLogic.java:88–121](<\/home/maxde/.codex_bench/corpus/syncope/core/idrepo/logic/src/main/java/org/apache/syncope/core/logic/AbstractAnyLogic.java:88>)).\n2. Fehlt danach der Realm im verarbeiteten Request (`before.key().getRealm() == null`), wird `InvalidRealm` ausgelöst ([AbstractUserLogic.java:89–91](<\/home/maxde/.codex_bench/corpus/syncope/core/idrepo/logic/src/main/java/org/apache/syncope/core/logic/AbstractUserLogic.java:89>)).\n3. Bei normaler Erstellung (`self == false`) werden die effektiven `USER_CREATE`-Reiche für den Ziel-Realm ermittelt und mit `userDAO.securityChecks(...)` gegen Realm und Gruppenmitgliedschaften geprüft ([AbstractUserLogic.java:93–104](<\/home/maxde/.codex_bench/corpus/syncope/core/idrepo/logic/src/main/java/org/apache/syncope/core/logic/AbstractUserLogic.java:93>)).\n4. Die eigentliche Provisionierung übernimmt das Feld `provisioningManager` vom Typ `UserProvisioningManager`: `provisioningManager.create(...)` erhält den verarbeiteten User-Request, `nullPriorityAsync`, den angemeldeten Benutzernamen und den Kontext `RE", "tools": ["shell({\"command\": \"/bin/bash -lc \\\"rg -n \\\\\\\"class AbstractUserLogic|doCreate\\\\\\\\(|UserTO create)", "shell({\"command\": \"/bin/bash -lc \\\"nl -ba core/idrepo/logic/src/main/java/org/apache/syncope/cor)", "shell({\"command\": \"/bin/bash -lc \\\"nl -ba core/idrepo/logic/src/main/java/org/apache/syncope/cor)", "shell({\"command\": \"/bin/bash -lc \\\"nl -ba core/provisioning-java/src/main/java/org/apache/syncop)", "shell({\"command\": \"/bin/bash -lc \\\"nl -ba core/idrepo/logic/src/main/java/org/apache/syncope/cor)"]}, {"task": "J3-CREATE-USER", "arm": "mcp", "rubric": 1.0, "answer": "`UserLogic.create(UserCR createReq, boolean nullPriorityAsync)` ist mit `@PreAuthorize` geschützt und verlangt die Berechtigung `IdRepoEntitlement.USER_CREATE`. Die Methode delegiert an `doCreate(createReq, false, nullPriorityAsync)` ([UserLogic.java:133–137](core/idrepo/logic/src/main/java/org/apache/syncope/core/logic/UserLogic.java:133)).\n\n`AbstractUserLogic.doCreate` ruft zunächst `beforeCreate(userCR)` auf und prüft, ob das aufgelöste Realm fehlt; dann wirft es `InvalidRealm`. Bei `self == false` ermittelt es die effektiven autorisierten Realms für `USER_CREATE` und lässt `userDAO.securityChecks(...)` Realm und Gruppenmitgliedschaften prüfen ([AbstractUserLogic.java:82–101](core/idrepo/logic/src/main/java/org/apache/syncope/core/logic/AbstractUserLogic.java:82)). Danach führt `provisioningManager.create(before.key(), nullPriorityAsync, AuthContextUtils.getUsername(), REST_CONTEXT)` die eigentliche Provisionierung aus. Das Ergebnis wird über `binder.getUserTO(created.key())` in ein `UserTO` umgewandelt und zusammen mit Status und Aktionen an `afterCreate(...)` übergeben ([AbstractUserLogic.java:106–109](core/idrepo/logic/src/main/java/org/apache/syncope/core/logic/AbstractUserLogic.java:106)).", "tools": ["search_code({\"project_id\": 2, \"query\": \"UserLogic|AbstractUserLogic|doCreate\", \"include_source\": true,)", "search_code({\"project_id\": 2, \"query\": \"AbstractUserLogic#doCreate\", \"include_source\": true, \"limit\": )", "get_code_entity({\"project_id\": 2, \"entity_id\": 51941, \"max_chars\": 5000})", "search_code({\"project_id\": 2, \"query\": \"UserLogic#create\", \"include_source\": true, \"limit\": 4})"]}], "truncated_outputs": 0, "n_sessions": 90}, "N": {"lead": "Dieselben sechs Fragen, dieselbe Rubrik, derselbe Ablauf, aber mit GPT-6-Luna (Reasoning medium) in der Codex CLI. Luna beantwortet fast alles, sobald sie den Code sehen kann, mit lokaler Shell wie mit MCP. Der Abstand zwischen den beiden Wegen ist klein und nicht abgesichert. MCP ist hier nicht besser und nicht schneller, braucht aber mehr Schritte und Tokens.", "findings": ["<b>Qualität:<\/b> Mit lokaler Shell erfüllt Luna im Mittel 95 % der Rubrikpunkte, mit MCP 92 %, ohne Werkzeuge 6 %. MCP liegt 3,2 Prozentpunkte hinter der Shell, das Intervall reicht von −7,5 bis +0,9 (p = 0,067). Das ist nach dem vorab festgelegten Maßstab (p &lt; 0,0125) <b>kein belastbarer Unterschied<\/b>.", "<b>Nutzbar (mindestens 50 % der Punkte):<\/b> Mit Shell und mit MCP in 30 von 30 Sitzungen, ohne Werkzeuge in 1 von 30. Die Aufgaben trennen die beiden Werkzeugwege bei Luna kaum, weil beide an der Obergrenze der Skala liegen (Deckeneffekt). Ein Vorteil von MCP wäre hier nur an schwereren Aufgaben messbar.", "<b>Ohne Werkzeuge:<\/b> Luna rät nicht. Sie antwortet meist, dass sie ohne Code nichts belegen kann (Rubrik 6 %). Anders als Qwen erfindet sie dabei keine Dateinamen oder Zeilen.", "<b>Geschwindigkeit:<\/b> Kein belastbarer Unterschied. MCP braucht im Mittel 35,2 s, die Shell 33,4 s (+1,8 s, Intervall −4,5 bis +7,4 s, p = 0,41). Je Aufgabe ist MCP bei J1 (−5,8 s) und J3 (−6,1 s) schneller und bei J2 (+7,8 s), C2 (+6,6 s), C3 (+5,6 s) und C1 (+2,7 s) langsamer.", "<b>Schritte und Tokens:<\/b> MCP braucht 7,9 Werkzeugaufrufe je Antwort, die Shell 4,1 (+94 %). Der Eingabeaufwand liegt bei 127.800 Tokens gegenüber 80.978 (+57 %, p &lt; 0,0001). Rund 80 % davon kamen aus dem Zwischenspeicher des Anbieters, die Zahlen sind deshalb nicht kostengleich. Es ist das einzige klar signifikante Ergebnis, und es spricht gegen MCP.", "<b>Die Suchlücke bei Java:<\/b> Auch Luna findet <code>AuthDataAccessor.authenticate<\/code> nicht auf Anhieb. In 9 von 15 Java-Sitzungen mit MCP gab es mindestens eine leere Suche. Luna formuliert dann um (<code>AuthDataAccessor<\/code>, <code>Klasse#methode<\/code>, <code>search_knowledge<\/code>) und kommt trotzdem ans Ziel: Rubrik 0,94 mit leerer Suche, 0,91 ohne. Die Lücke kostet Luna Schritte, aber keine Qualität.", "<b>Wo MCP Punkte liegen lässt:<\/b> Am deutlichsten bei C3 (Regeln und Batch). Die Ablehnungsdatei <code>DALYREJS<\/code> nennt MCP nur in 2 von 5 Läufen, die Shell in 5 von 5. Bei C2 fehlt die Herleitung der neuen Transaktions-ID in 3 von 5 Läufen (Shell: 2 von 5).", "<b>Fehler und Werkzeugnutzung:<\/b> Beide Wege sind fast fehlerfrei (Shell 0,23, MCP 0,03 Fehler je Sitzung). Alle 90 Sitzungen lieferten eine Antwort, es gab keine Zeitüberschreitung und keinen Hinweis auf Zugriffe außerhalb des Repositorys."], "method": ["<b>Modell:<\/b> <code>gpt-6-luna<\/code> mit Reasoning <code>medium<\/code>, ausgeführt über die Codex CLI 0.160.0 (<code>codex exec<\/code>) mit Cloud-Anbindung. Kein Seed und keine Temperaturkontrolle.", "<b>Design:<\/b> Identisch zu Kapitel 1: 6 Aufgaben × 3 Varianten × 5 Wiederholungen = 90 Sitzungen, gleiche Fragen, gleiche Rubrik (gleicher Prüfsummenwert), gleicher Reihenfolgeplan, gleiche Statistik.", "<b>Varianten:<\/b> Ohne Werkzeuge: Shell und MCP abgeschaltet, leeres Arbeitsverzeichnis. Lokal: nur die Codex-Shell (lesend) im Checkout. MCP: nur die Doctus-Werkzeuge, Shell abgeschaltet.", "<b>Isolierung:<\/b> Eigenes Codex-Verzeichnis ohne Plugins, Apps, Websuche und Gedächtnis. Der Checkout lag in einer Kopie außerhalb des Repositorys, jeder Shell-Befehl wurde auf Zugriffe außerhalb davon und auf Benchmarkbegriffe geprüft. Es gab keinen Treffer.", "<b>Abweichungen:<\/b> Keine Sitzung ist ausgefallen oder wurde wiederholt. Protokoll und Prüfsumme stehen in <code>PROTOCOL_CH2.md<\/code> und <code>manifest_ch2.lock<\/code>."], "limits": ["Deckeneffekt: Beide Werkzeugwege liegen bei 92 bis 95 %. Kleine Qualitätsunterschiede lassen sich kaum messen, und die Rubrik trennt gute von sehr guten Antworten nicht.", "Die lokale Variante ist die Shell von Codex (<code>rg<\/code>, <code>sed<\/code>) und damit mächtiger als die drei Dateitools in Kapitel 1. Der Vergleich der Kapitel ist deshalb nur beschreibend.", "Die Zeiten enthalten Cloud-Latenz und Serverlast. Die Tokenzahlen enthalten den Systemtext von Codex (rund 8.000 Tokens je Aufruf, gemessen in der Variante ohne Werkzeuge) und Zwischenspeichertreffer. Beides ist nicht mit Kapitel 1 vergleichbar.", "Das Modell kann die öffentlichen Repositories aus dem Training kennen. Die Variante ohne Werkzeuge zeigt mit 6 % wenig Vorwissen, ausschließen lässt es sich nicht.", "Die Rubrik prüft Begriffe, keine Bedeutung, und es gibt keine menschliche Zweitbewertung. Nur sechs Aufgaben aus zwei Beständen."]}, "chap": {"model": "GPT-6-Luna (medium)", "short": "Luna", "eyebrow": "Kapitel 2 · Codex CLI mit gpt-6-luna, Reasoning medium", "title": "Kapitel 2: GPT-6-Luna in der Codex CLI", "armLabel": {"none": "ohne Werkzeuge", "local": "lokale Shell", "mcp": "mit MCP"}, "footer": "Modell gpt-6-luna · Reasoning medium · Codex CLI 0.160.0 · Cloud"}}], "cross": {"title": "MCP im Benchmark: zwei Modelle, drei Kapitel", "lead": "Sechs Code-Fragen an Qwen3-8B (lokal) und GPT-6-Luna (Codex CLI), je ohne Werkzeuge, mit lokalen Werkzeugen und mit Doctus-MCP. Kapitel 1 und 2 messen die erste MCP-Fassung, Kapitel 3 die überarbeitete Schnittstelle v2. Kurz gesagt: Das Modell entscheidet über die Qualität. Die Überarbeitung hat dem kleinen Modell die Qualität mehr als verdoppelt, dem starken Modell wenig geändert, und sie hat Zeit und Tokens insgesamt nicht gesenkt.", "findings": ["<b>Das Modell zählt mehr als das Werkzeug.<\/b> Luna erreicht mit Shell und mit MCP 95 % und 92 % der Rubrikpunkte, Qwen in der besten Variante 20 %. Der Abstand zwischen den Modellen beträgt etwa das Fünffache, der zwischen den Werkzeugwegen höchstens ein paar Prozentpunkte.", "<b>Qualität mit MCP gegenüber lokalen Werkzeugen:<\/b> Bei Qwen +11 Prozentpunkte (p = 0,06), bei Luna −3 Prozentpunkte (p = 0,067). Beide Unterschiede sind nach dem vorab festgelegten Maßstab nicht abgesichert und zeigen in entgegengesetzte Richtungen.", "<b>Brauchbare Antworten:<\/b> Luna liefert sie mit und ohne MCP (30 von 30). Qwen schafft mit MCP 7 von 30, mit lokalen Dateitools 1 von 30 und ohne Werkzeuge keine. Nur für das kleine Modell macht MCP den Unterschied zwischen unbrauchbar und gelegentlich brauchbar, und nur bei COBOL.", "<b>Geschwindigkeit:<\/b> MCP ist in keinem Kapitel nachweislich schneller (Qwen +2,4 s, Luna +1,8 s, beide nicht signifikant). Je nach Aufgabe ist es mal schneller, mal langsamer.", "<b>Tokens:<\/b> MCP braucht in beiden Kapiteln deutlich mehr Eingabe als lokale Werkzeuge (Qwen +126 %, Luna +57 %, beide p &lt; 0,001). Das ist der einzige Befund, der in beiden Modellen gleich ausfällt.", "<b>Robustheit der Schnittstelle:<\/b> Bei Java findet die Suche die Form <code>Klasse.methode<\/code> nicht. Luna formuliert um und verliert keine Qualität, nur Schritte. Qwen gibt auf und erreicht bei Java keinen spezifischen Punkt. Je schwächer das Modell, desto wichtiger wird eine fehlertolerante Schnittstelle.", "<b>Ohne Werkzeuge:<\/b> Qwen rät und erfindet Dateinamen, Luna sagt „unbelegt“. Beide bekommen so gut wie keine spezifischen Punkte."], "notes": ["Vergleichbar zwischen den Kapiteln sind die Fragen, die Rubrik und damit der Rubrikwert und die Nutzbarkeit. Nicht vergleichbar sind Zeiten (Cloud gegen lokale GPU) und Tokens (anderer Systemtext, anderer Tokenizer, Zwischenspeicher).", "Die lokalen Werkzeuge unterscheiden sich: In Kapitel 1 sind es drei einfache Dateitools, in Kapitel 2 die Codex-Shell. Dass Luna mit der Shell nahezu perfekt ist und Qwen mit den Dateitools schwach, liegt auch am Modell und nicht nur an den Werkzeugen.", "Zwischen den Modellen gibt es keinen statistischen Test. Alle Tests betreffen die Unterschiede zwischen den Varianten innerhalb eines Modells.", "Bei Luna liegen beide Werkzeugwege an der Obergrenze der Skala. Ein Vorteil von MCP ließe sich nur mit schwereren
