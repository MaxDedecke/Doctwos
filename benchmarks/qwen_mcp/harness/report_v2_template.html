<title>Doctus MCP-Benchmark</title>
<style>
/* Layout: ein Lesefluss, Befund oben, danach Koordinatensystem, Disziplinen, Effekte, Methodik. */
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --ink: #16181d;
  --ink-2: #4a4f59;
  --ink-3: #6e7380;
  --line: #dcdde2;
  --grid: #ebecef;
  --mcp: #2a78d6;
  --local: #eb6834;
  --none: #1baf7a;
  --good: #1f7a45;
  --bad: #b3372f;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --surface: #1a1d23; --ink: #eceef2; --ink-2: #b5bac4; --ink-3: #8b909c;
    --line: #2d313a; --grid: #23272f; --mcp: #3987e5; --local: #d95926; --none: #199e70;
    --good: #4cc27f; --bad: #ee7b72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --surface: #1a1d23; --ink: #eceef2; --ink-2: #b5bac4; --ink-3: #8b909c;
  --line: #2d313a; --grid: #23272f; --mcp: #3987e5; --local: #d95926; --none: #199e70;
  --good: #4cc27f; --bad: #ee7b72; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-inline: 20px; padding-block: 28px 64px; }
main { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(28px, 4.2vw, 42px); line-height: 1.12; }
h2 { font-size: 24px; line-height: 1.2; }
h3 { font-size: 17px; }
p { margin: 0; }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.lead { font-size: 18px; color: var(--ink-2); max-width: 68ch; }
.sec { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sec > p.sub { color: var(--ink-2); max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.sw.mcp { background: var(--mcp); } .sw.local { background: var(--local); } .sw.none { background: var(--none); }

.verdict { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.vcell { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.vcell .k { font-size: 13px; color: var(--ink-3); }
.vcell .v { font-family: var(--font-data); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.vcell .d { font-size: 13px; color: var(--ink-2); }
.pos { color: var(--good); } .neg { color: var(--bad); }

svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--font-data); fill: var(--ink-2); font-size: 11.5px; }
svg .t-strong { fill: var(--ink); }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .axis { stroke: var(--line); stroke-width: 1.2; }
.chart-wrap { position: relative; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.4; box-shadow: 0 4px 16px rgba(0,0,0,.14); z-index: 5; min-width: 150px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; font-family: var(--font-data); font-size: 12px; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
thead th { font-family: var(--font-data); font-size: 12px; color: var(--ink-3); font-weight: 500; }
.tablewrap { overflow-x: auto; }
.badge { display: inline-block; font-family: var(--font-data); font-size: 11.5px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); }
.badge.mcp { border-color: var(--mcp); color: var(--mcp); } .badge.local { border-color: var(--local); color: var(--local); } .badge.none { border-color: var(--none); color: var(--none); }
details { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--surface); }
details + details { margin-top: 8px; }
summary { cursor: pointer; font-weight: 600; font-size: 15px; }
details pre { white-space: pre-wrap; font-family: var(--font-body); font-size: 14px; color: var(--ink-2); margin: 10px 0 0; overflow-wrap: anywhere; }
.toolline { font-family: var(--font-data); font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; margin-top: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.note { font-size: 13.5px; color: var(--ink-3); max-width: 72ch; }
ul.clean { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }
.theme-toggle { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 14px; font-family: var(--font-data); font-size: 12px; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; cursor: pointer; z-index: 10; }
:focus-visible { outline: 2px solid var(--mcp); outline-offset: 2px; }
@media (max-width: 560px) { body { padding-inline: 16px; } .card { padding: 12px; } }
.nav { display: flex; flex-wrap: wrap; gap: 8px 18px; font-family: var(--font-data); font-size: 13px; }
.nav a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.nav a:hover { color: var(--ink); border-color: var(--ink-3); }
.top3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.top3 > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.part { display: flex; flex-direction: column; gap: 28px; border-top: 2px solid var(--line); padding-top: 32px; scroll-margin-top: 16px; }
details.appendix > summary { font-size: 17px; font-family: var(--font-display); }
.rowhl td { background: color-mix(in srgb, var(--mcp) 9%, var(--surface)); font-weight: 600; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">

<button class="theme-toggle" id="themeBtn" type="button" aria-label="Darstellung wechseln">hell / dunkel</button>
<main id="root"></main>

<script id="chapters" type="application/json">__CHAPTERS__</script>
<script>
function renderChapter(D, N, $root, chap) {
  var ARMS = ['none', 'local', 'mcp'];
  var ARM_LABEL = chap.armLabel;
  var ARM_SHORT = { none: 'ohne', local: 'lokal', mcp: 'MCP' };
  var COLORS = { none: 'var(--none)', local: 'var(--local)', mcp: 'var(--mcp)' };
  var NS = 'http://www.w3.org/2000/svg';

  function el(tag, attrs, html) { var e = document.createElement(tag); if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]); if (html != null) e.innerHTML = html; return e; }
  function sv(tag, attrs, text) { var e = document.createElementNS(NS, tag); if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; }
  function f(x, d) { return x == null ? '–' : Number(x).toFixed(d == null ? 1 : d); }
  function pct(x, d) { return x == null ? '–' : (x * 100).toFixed(d == null ? 0 : d) + ' %'; }
  function signed(x, d, suf) { if (x == null) return '–'; var s = x > 0 ? '+' : (x < 0 ? '−' : ''); return s + Math.abs(x).toFixed(d) + (suf || ''); }
  function cell(t, a) { return D.cells[t + '|' + a]; }
  var tasks = D.tasks.map(function (t) { return t.id; });
  var catOf = {}; D.tasks.forEach(function (t) { catOf[t.id] = t.category; });
  var projOf = {}; D.tasks.forEach(function (t) { projOf[t.id] = t.project === 'carddemo' ? 'COBOL' : 'Java'; });
  var eff = (D.effects['mcp-local'] || []);
  function effOf(key, pair) { return (D.effects[pair || 'mcp-local'] || []).filter(function (e) { return e.key === key; })[0]; }

  var tip = el('div', { class: 'tip', role: 'status' });
  function showTip(wrap, evt, html) {
    tip.innerHTML = html; wrap.appendChild(tip);
    var r = wrap.getBoundingClientRect(); var x = evt.clientX - r.left + 14; var y = evt.clientY - r.top + 14;
    if (x + 200 > r.width) x = Math.max(4, evt.clientX - r.left - 214);
    tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.style.opacity = 1;
  }
  function hideTip() { tip.style.opacity = 0; }

  /* ---------- Kopf und Befund ---------- */
  var head = el('header', { class: 'sec' });
  head.appendChild(el('div', { class: 'eyebrow' }, chap.eyebrow + ' · ' + D.n_sessions + ' Sitzungen'));
  head.appendChild(el('h2', { style: 'font-size:30px' }, chap.title));
  head.appendChild(el('p', { class: 'lead' }, N.lead));
  $root.appendChild(head);

  var vd = el('div', { class: 'verdict' });
  function vcell(label, value, detail, cls) { vd.appendChild(el('div', { class: 'vcell' }, '<span class="k">' + label + '</span><span class="v ' + (cls || '') + '">' + value + '</span><span class="d">' + detail + '</span>')); }
  var q = effOf('rubric'), tm = effOf('wall_s'), tk = effOf('tokens_total'), us = effOf('usable');
  if (q) vcell('Qualität (Rubrik)', pct(q.mean_a) + ' vs ' + pct(q.mean_b), 'MCP vs lokale Tools · Differenz ' + signed(q.diff * 100, 1, ' PP') + ' [' + signed(q.lo * 100, 1) + '; ' + signed(q.hi * 100, 1) + ']', q.diff > 0 ? 'pos' : 'neg');
  if (tm) vcell('Zeit je Antwort', f(tm.mean_a, 0) + ' s vs ' + f(tm.mean_b, 0) + ' s', 'MCP vs lokale Tools · ' + signed(tm.rel * 100, 0, ' %') + ' (p = ' + f(tm.p, 3) + ')', tm.diff < 0 ? 'pos' : 'neg');
  if (tk) vcell('Tokens je Antwort', Math.round(tk.mean_a).toLocaleString('de-DE') + ' vs ' + Math.round(tk.mean_b).toLocaleString('de-DE'), 'MCP vs lokale Tools · ' + signed(tk.rel * 100, 0, ' %') + ' (p = ' + f(tk.p, 3) + ')', tk.diff < 0 ? 'pos' : 'neg');
  if (us) vcell('Nutzbare Antworten', pct(us.mean_a) + ' vs ' + pct(us.mean_b), 'Anteil mit ≥ 50 % Rubrik · MCP vs lokal', us.diff > 0 ? 'pos' : 'neg');
  $root.appendChild(vd);

  var fin = el('section', { class: 'sec' });
  fin.appendChild(el('h2', null, 'Befund in Kürze'));
  var ul = el('ul', { class: 'clean' });
  N.findings.forEach(function (t) { ul.appendChild(el('li', null, t)); });
  fin.appendChild(ul);
  $root.appendChild(fin);

  /* ---------- Koordinatensystem: Qualität über Zeit ---------- */
  var s1 = el('section', { class: 'sec' });
  s1.appendChild(el('h2', null, 'Qualität gegen Geschwindigkeit'));
  s1.appendChild(el('p', { class: 'sub' }, 'Jeder große Punkt ist der Mittelwert einer Aufgabe mit fünf Wiederholungen, die kleinen Punkte sind die einzelnen Sitzungen. Oben links ist am besten: schnell und gut. Die Linie zeigt je Aufgabe den Weg von den lokalen Dateitools (orange) zu MCP (blau).'));
  var lg = el('div', { class: 'legend' }); ARMS.slice().reverse().forEach(function (a) { lg.appendChild(el('span', null, '<i class="sw ' + a + '"></i>' + ARM_LABEL[a])); });
  s1.appendChild(lg);
  var wrap1 = el('div', { class: 'chart-wrap card' }); s1.appendChild(wrap1); $root.appendChild(s1);

  (function scatter() {
    var W = 900, H = 520, m = { l: 56, r: 24, t: 24, b: 54 };
    var maxT = 0; D.sessions.forEach(function (s) { if (s.wall_s > maxT) maxT = s.wall_s; });
    var xmax = Math.ceil(maxT / 10) * 10; if (xmax < 20) xmax = 20;
    var X = function (v) { return m.l + (v / xmax) * (W - m.l - m.r); };
    var Y = function (v) { return H - m.b - v * (H - m.t - m.b); };
    var svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Streudiagramm Qualität gegen Wandzeit je Aufgabe und Arm' });
    for (var i = 0; i <= 4; i++) { var v = i / 4; svg.appendChild(sv('line', { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), class: 'grid' })); svg.appendChild(sv('text', { x: m.l - 8, y: Y(v) + 4, 'text-anchor': 'end' }, Math.round(v * 100) + ' %')); }
    var step = xmax <= 60 ? 10 : (xmax <= 150 ? 20 : 50);
    for (var x = 0; x <= xmax; x += step) { svg.appendChild(sv('line', { x1: X(x), x2: X(x), y1: m.t, y2: H - m.b, class: 'grid' })); svg.appendChild(sv('text', { x: X(x), y: H - m.b + 18, 'text-anchor': 'middle' }, x + ' s')); }
    svg.appendChild(sv('line', { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, class: 'axis' }));
    svg.appendChild(sv('line', { x1: m.l, x2: m.l, y1: m.t, y2: H - m.b, class: 'axis' }));
    svg.appendChild(sv('text', { x: (W + m.l) / 2, y: H - 10, 'text-anchor': 'middle', class: 't-strong' }, 'Wandzeit je Antwort (Sekunden, niedriger ist besser) →'));
    var yl = sv('text', { transform: 'rotate(-90)', x: -(H - m.b + m.t) / 2, y: 14, 'text-anchor': 'middle', class: 't-strong' }, 'Rubrikwert (höher ist besser) →'); svg.appendChild(yl);
    svg.appendChild(sv('text', { x: m.l + 10, y: m.t + 16, style: 'font-size:12px;opacity:.75' }, '▲ gut und schnell'));
    svg.appendChild(sv('text', { x: W - m.r - 10, y: H - m.b - 10, 'text-anchor': 'end', style: 'font-size:12px;opacity:.75' }, 'langsam und schwach ▼'));
    D.sessions.forEach(function (s) { var c = sv('circle', { cx: X(s.wall_s), cy: Y(s.rubric), r: 3, fill: COLORS[s.arm], 'fill-opacity': .28 }); svg.appendChild(c); });
    tasks.forEach(function (t) { var a = cell(t, 'local'), b = cell(t, 'mcp'); if (!a || !b) return;
      svg.appendChild(sv('line', { x1: X(a.wall_s), y1: Y(a.rubric), x2: X(b.wall_s), y2: Y(b.rubric), stroke: 'var(--ink-3)', 'stroke-width': 1.2, 'stroke-dasharray': '3 3', opacity: .7 })); });
    tasks.forEach(function (t) { ARMS.forEach(function (a) { var c = cell(t, a); if (!c) return;
      var g = sv('g', { tabindex: 0, style: 'cursor:pointer', 'aria-label': t + ' ' + ARM_LABEL[a] });
      g.appendChild(sv('circle', { cx: X(c.wall_s), cy: Y(c.rubric), r: 15, fill: 'transparent' }));
      g.appendChild(sv('circle', { cx: X(c.wall_s), cy: Y(c.rubric), r: 8, fill: COLORS[a], stroke: 'var(--surface)', 'stroke-width': 2 }));
      if (a === 'mcp') g.appendChild(sv('text', { x: X(c.wall_s) + 11, y: Y(c.rubric) - 9, class: 't-strong', style: 'font-size:11px' }, t.split('-')[0]));
      var html = function () { return '<b>' + t + '</b> · ' + catOf[t] + ' (' + projOf[t] + ')<div class="row"><span>' + ARM_LABEL[a] + '</span></div><div class="row"><span>Qualität</span><span>' + pct(c.rubric) + ' ± ' + pct(c.rubric_sd) + '</span></div><div class="row"><span>Zeit</span><span>' + f(c.wall_s) + ' s</span></div><div class="row"><span>Tokens</span><span>' + Math.round(c.tokens_total) + '</span></div><div class="row"><span>Werkzeugaufrufe</span><span>' + f(c.tool_calls) + '</span></div>'; };
      g.addEventListener('mousemove', function (e) { showTip(wrap1, e, html()); }); g.addEventListener('mouseleave', hideTip);
      g.addEventListener('focus', function () { var r = g.getBoundingClientRect(), w = wrap1.getBoundingClientRect(); showTip(wrap1, { clientX: r.left + 10, clientY: r.top + 10 }, html()); }); g.addEventListener('blur', hideTip);
      svg.appendChild(g); }); });
    wrap1.appendChild(svg);
  })();

  /* ---------- Disziplinen ---------- */
  var s2 = el('section', { class: 'sec' });
  s2.appendChild(el('h2', null, 'Die sechs Disziplinen'));
  s2.appendChild(el('p', { class: 'sub' }, 'Jede Disziplin ist eine Frage an echten Code mit überprüfbarer Antwort. Links steht, wie viel der Antwort stimmt, rechts, wie lange das Modell braucht. Die Zahl am Balkenende ist der Mittelwert aus fünf Läufen.'));
  var lg2 = lg.cloneNode(true); s2.appendChild(lg2);
  var grid2 = el('div', { class: 'grid2' });
  var wq = el('div', { class: 'card chart-wrap' }); var wt = el('div', { class: 'card chart-wrap' });
  grid2.appendChild(wq); grid2.appendChild(wt); s2.appendChild(grid2); $root.appendChild(s2);

  function barChart(wrap, key, title, fmtv, max, axisSuffix) {
    var rowH = 74, W = 440, m = { l: 128, r: 52, t: 30, b: 28 }, H = m.t + m.b + tasks.length * rowH;
    var X = function (v) { return m.l + (v / max) * (W - m.l - m.r); };
    var svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': title });
    svg.appendChild(sv('text', { x: m.l, y: 14, class: 't-strong', style: 'font-size:12.5px' }, title));
    var ticks = 4; for (var i = 0; i <= ticks; i++) { var v = max * i / ticks; svg.appendChild(sv('line', { x1: X(v), x2: X(v), y1: m.t, y2: H - m.b, class: 'grid' })); svg.appendChild(sv('text', { x: X(v), y: H - m.b + 16, 'text-anchor': 'middle' }, fmtv(v, true))); }
    tasks.forEach(function (t, ti) {
      var y0 = m.t + ti * rowH; var yc = y0 + rowH / 2;
      svg.appendChild(sv('text', { x: m.l - 10, y: yc - 4, 'text-anchor': 'end', class: 't-strong', style: 'font-size:12px' }, catOf[t]));
      svg.appendChild(sv('text', { x: m.l - 10, y: yc + 10, 'text-anchor': 'end', style: 'font-size:10.5px;opacity:.8' }, t.split('-')[0] + ' · ' + projOf[t]));
      var winner = null; var bestV = null;
      ARMS.forEach(function (a, ai) { var c = cell(t, a); if (!c) return; var by = y0 + 8 + ai * 19;
        var val = c[key]; var g = sv('g', { tabindex: 0 });
        g.appendChild(sv('rect', { x: m.l, y: by - 2, width: W - m.l - m.r + 40, height: 18, fill: 'transparent' }));
        g.appendChild(sv('rect', { x: m.l, y: by, width: Math.max(2, X(val) - m.l), height: 13, rx: 3, fill: COLORS[a] }));
        g.appendChild(sv('text', { x: X(val) + 6, y: by + 11, class: 't-strong', style: 'font-size:11px' }, fmtv(val)));
        var html = '<b>' + t + '</b><div class="row"><span>' + ARM_LABEL[a] + '</span><span>' + fmtv(val) + '</span></div>';
        g.addEventListener('mousemove', function (e) { showTip(wrap, e, html); }); g.addEventListener('mouseleave', hideTip);
        g.addEventListener('focus', function () { var r = g.getBoundingClientRect(); showTip(wrap, { clientX: r.left + 20, clientY: r.top + 10 }, html); }); g.addEventListener('blur', hideTip);
        svg.appendChild(g); });
    });
    svg.appendChild(sv('line', { x1: m.l, x2: m.l, y1: m.t, y2: H - m.b, class: 'axis' }));
    wrap.appendChild(svg);
  }
  barChart(wq, 'rubric', 'Antwortqualität (Anteil erfüllter Rubrikpunkte, höher ist besser)', function (v, axis) { return axis ? Math.round(v * 100) + '%' : Math.round(v * 100) + ' %'; }, 1);
  var tmax = 0; D.speed.forEach(function (r) { ARMS.forEach(function (a) { if (r[a] > tmax) tmax = r[a]; }); }); tmax = Math.ceil(tmax / 10) * 10 || 10;
  barChart(wt, 'wall_s', 'Zeit je Antwort (Sekunden, niedriger ist besser)', function (v, axis) { return axis ? Math.round(v) : v.toFixed(1) + ' s'; }, tmax);

  /* ---------- Wer ist wo schneller ---------- */
  var s3 = el('section', { class: 'sec' });
  s3.appendChild(el('h2', null, 'Wo ist MCP schneller, wo nicht?'));
  s3.appendChild(el('p', { class: 'sub' }, 'Zeit je Antwort im Mittel. Die Spalte „Unterschied“ vergleicht MCP mit den lokalen Dateitools: ein negativer Wert heißt, MCP war schneller.'));
  var tw = el('div', { class: 'card tablewrap' });
  var tb = '<table><thead><tr><th>Disziplin</th><th>ohne</th><th>lokal</th><th>MCP</th><th>Unterschied MCP–lokal</th><th>Qualität lokal → MCP</th><th>Schnellster Arm</th></tr></thead><tbody>';
  D.speed.forEach(function (r) {
    var diff = (r.mcp != null && r.local != null) ? r.mcp - r.local : null; var rel = diff != null ? diff / r.local : null;
