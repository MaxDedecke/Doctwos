<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Browser-tab favicon: die Kettenglieder aus components/Logo.tsx (CodenaMark)
       auf eigener Kachel, damit sie auf hellen wie dunklen Tab-Leisten sichtbar sind.
       Farben fest aus dem Dark-Theme in globals.css (ds-background, ds-foreground,
       ds-accent), weil eine statische Datei die CSS-Variablen der Seite nicht kennt.
       Bei geänderten Pfaden in CodenaMark mitziehen. -->
  <defs>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff" />
      <path d="M42.6 30.1A21 21 0 0 1 55.8 38" stroke="#000" stroke-width="15" />
    </mask>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0E1E1E" />
  <circle cx="36" cy="50" r="21" stroke="#ECF7F2" stroke-width="9" />
  <circle cx="64" cy="50" r="21" stroke="#60A5FA" stroke-width="9" mask="url(#gap)" />
</svg>
