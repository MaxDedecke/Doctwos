[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codena-models"
dynamic = ["version"]
description = "Gemeinsames SQLAlchemy-Datenmodell von Codena-Backend und -Parser"
requires-python = ">=3.11"
# Die genauen Versionen pinnen backend/requirements.txt und parser/requirements.txt.
dependencies = ["sqlalchemy>=2.0", "pgvector>=0.5", "cryptography>=42", "redis>=5"]

[tool.setuptools]
packages = ["codena_models"]

[tool.setuptools.dynamic]
version = { attr = "codena_models.__version__" }
